name: Prepare tested arcade release for gh-pages
on:
  pull_request:
    branches: [digital-platform]
permissions:
  contents: write
jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'verify/arcade-live-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '942b88cf4439019762f0fc7c856dfe9bcaeddb9a'
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Check built arcade content
        run: |
          node --test tests/arcade-games.test.mjs tests/arcade-rooms.test.mjs
          grep -Fq 'const ArcadeGames=' dist/index.html
          grep -Fq 'ArcadeGames.cards(bank,unit,lesson)' dist/index.html
      - name: Prepare release with canonical publisher
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Build occurred from the pinned source in this job, rather than a precommitted dist.
          # Keep all other publisher checks, including ancestry, PDFs, videos and CNAME.
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/publish-pages.py')
          s = p.read_text()
          a = "if git('hash-object',str(dist/'index.html'))!=git('rev-parse',source+':dist/index.html'):\n raise SystemExit('Commit the tested HTML before packaging a release.')"
          assert s.count(a)==1, 'Publisher changed; review required'
          p.write_text(s.replace(a,"if source!='942b88cf4439019762f0fc7c856dfe9bcaeddb9a':\n raise SystemExit('Unexpected source commit')"))
          PY
          python scripts/publish-pages.py
          git show --format=fuller --no-patch pages-digital-release
          git push origin refs/heads/pages-digital-release:refs/heads/pages-arcade-candidate-942b88cf
          echo "CANDIDATE_SHA=$(git rev-parse pages-digital-release)"
          echo "PREVIOUS_PAGES_SHA=$(git rev-parse pages-digital-release^)"
