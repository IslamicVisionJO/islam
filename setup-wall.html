ر؟","options":[{"id":"o3","text":"انتظار انتهاء العدة لتكون الرجعة بلا عقد"},{"id":"o4","text":"منع الرجعة في جميع الأحوال"},{"id":"o2","text":"اشتراط زواجها بآخر أولًا"},{"id":"o1","text":"مراجعتها أثناء العدة دون عقد ومهر جديدين"}],"correct_id":"o1","explanation":"شرح الدرس الطلاق الرجعي وإمكان الرجعة في العدة دون عقد جديد.","page":102},{"id":"u03_l02_q135","lesson_id":"u03_l02","difficulty":"medium","prompt":"انتهت عدة مطلقة بطلقة أولى دون رجعة؛ فما الوصف الصحيح لإمكان العودة؟","options":[{"id":"o4","text":"تُلغى الطلقة السابقة من كل وجه"},{"id":"o2","text":"عودة تلقائية دون موافقتها"},{"id":"o3","text":"يشترط زواجها برجل آخر أولًا"},{"id":"o1","text":"لا عودة إلا برضاها وعقد ومهر جديدين"}],"correct_id":"o1","explanation":"هذا من أمثلة البينونة الصغرى في شرح الكتاب.","page":103},{"id":"u03_l02_q136","lesson_id":"u03_l02","difficulty":"hard","prompt":"ما الشرط الذي لا يوجد في العودة بعد البينونة الصغرى ويوجد بعد البينونة الكبرى؟","options":[{"id":"o4","text":"التأكد من انتهاء العدة الحالية"},{"id":"o2","text":"رضا المرأة بالعقد الجديد"},{"id":"o1","text":"زواج صحيح بزوج آخر ثم انتهاء تلك العلاقة والعدة"},{"id":"o3","text":"دفع مهر بعقد جديد"}],"correct_id":"o1","explanation":"شرح الدرس اشتراط زواج آخر صحيح في البينونة الكبرى دون الصغرى.","page":103},{"id":"u03_l02_q142","lesson_id":"u03_l02","difficulty":"medium","prompt":"لماذا لا يُعد الطلاق وسيلة مقبولة للإضرار بالزوجة أو حرمانها من حقوقها؟","options":[{"id":"o4","text":"لأن الحقوق تسقط بمجرد الخلاف"},{"id":"o3","text":"لأن إلحاق الضرر بالآخرين مقصد للزواج"},{"id":"o1","text":"لأن الشرع منع الطلاق التعسفي القائم على الإضرار والظلم"},{"id":"o2","text":"لأن الطلاق لا أثر له في الحقوق"}],"correct_id":"o1","explanation":"ينص الدرس على منع قصد الإضرار وذكر التعويض في القانون عند الطلاق التعسفي.","page":101},{"id":"u03_l02_q144","lesson_id":"u03_l02","difficulty":"medium","prompt":"طلّق رجل زوجته المدخول بها طلقة أولى ولم تنقضِ عدتها؛ أي أثر يميّز الطلاق الرجعي؟","options":[{"id":"o3","text":"ضرورة زواجها بآخر قبل الرجعة"},{"id":"o4","text":"سقوط واجبات العلاقة كلها فورًا"},{"id":"o2","text":"انتهاء حق الرجعة في كل الأحوال"},{"id":"o1","text":"إمكان مراجعتها في العدة دون عقد ومهر جديدين"}],"correct_id":"o1","explanation":"عرّف الدرس الرجعي بما يتيح المراجعة أثناء العدة دون عقد أو مهر جديد.","page":102},{"id":"u03_l02_q153","lesson_id":"u03_l02","difficulty":"medium","prompt":"بعد طلقة أولى رجعية، ما أثر مرور عدة الزوجة دون أن يراجعها زوجها؟","options":[{"id":"o4","text":"تعود الزوجية دون رضا الطرفين ولا عقد"},{"id":"o3","text":"تتحول تلقائيًا إلى طلقة ثالثة"},{"id":"o2","text":"تبقى الرجعة ممكنة دون عقد إلى غير نهاية"},{"id":"o1","text":"تصير الفرقة بائنة بينونة صغرى ويحتاج الرجوع إلى عقد جديد برضاها"}],"correct_id":"o1","explanation":"فرّق الكتاب بين الرجعي أثناء العدة والبائن بينونة صغرى بعد انقضائها.","page":103},{"id":"u03_l02_q181","lesson_id":"u03_l02","difficulty":"medium","prompt":"ما الذي يجعل الطلاق التعسفي مختلفًا عن الطلاق عند تعذر الصلح؟","options":[{"id":"o3","text":"وقوعه وفق ضوابط تحفظ الحقوق"},{"id":"o2","text":"وقوعه بعد استحكام الخلاف مع محاولة الإصلاح"},{"id":"o1","text":"وقوعه للإضرار أو بلا سبب مقبول شرعًا"},{"id":"o4","text":"وقوعه بعد دراسة حال الأسرة وأبنائها"}],"correct_id":"o1","explanation":"ميز الدرس بين مشروعية الطلاق عند دواعيه وتحريم قصد الإضرار والتعسف.","page":101},{"id":"u03_l02_q183","lesson_id":"u03_l02","difficulty":"medium","prompt":"ما الإجراء الذي ينسجم مع مقصد الإصلاح قبل إنهاء الزواج عند نشوب نزاع شديد؟","options":[{"id":"o1","text":"طلب التحكيم والسعي إلى التوفيق بين الزوجين"},{"id":"o4","text":"إغلاق باب الحوار دون محاولة"},{"id":"o3","text":"البدء بحرمان الأبناء من حقوقهم"},{"id":"o2","text":"إفشاء الأسرار الشخصية على الملأ"}],"correct_id":"o1","explanation":"استشهد الدرس بآيات حسن المعاشرة والتحكيم قبل تعذر الصلح.","page":102},{"id":"u03_l02_q185","lesson_id":"u03_l02","difficulty":"medium","prompt":"زوج طلّق زوجته طلقة أولى بعد الدخول وما تزال في عدتها؛ ما الصفة التي تميز هذا الطلاق؟","options":[{"id":"o2","text":"تحريم أي رجعة إلى الأبد"},{"id":"o4","text":"انتهاء كل علاقة فورًا بلا عدّة"},{"id":"o1","text":"إمكان الرجعة ضمن العدّة دون عقد جديد"},{"id":"o3","text":"الحاجة إلى زواجها من رجل آخر قبل الرجعة"}],"correct_id":"o1","explanation":"يفرق الدرس بين الطلاق الرجعي والبائن بحسب إمكان الرجعة وعدد الطلقات.","page":103},{"id":"u03_l02_q186","lesson_id":"u03_l02","difficulty":"medium","prompt":"أي سلوك بعد الطلاق ينسجم مع آداب الشريعة إذا كان بين الزوجين أطفال؟","options":[{"id":"o4","text":"نشر تفاصيل الحياة الزوجية السابقة"},{"id":"o1","text":"حفظ حقوق الأطفال ورعايتهم بعيدًا عن الخلاف"},{"id":"o3","text":"التوقف عن النفقة الواجبة لمجرد الخصومة"},{"id":"o2","text":"استعمال الأبناء وسيلة للضغط على الآخر"}],"correct_id":"o1","explanation":"أبرز الكتاب رعاية الأبناء والستر وحسن المعاملة وأداء الحقوق بعد الطلاق.","page":104},{"id":"u03_l02_q187","lesson_id":"u03_l02","difficulty":"hard","prompt":"لماذا يلزم القانون الأردني بتسجيل وقوع الطلاق والرجعة في المحكمة الشرعية؟","options":[{"id":"o3","text":"لإلغاء حق الطفل في الرعاية"},{"id":"o2","text":"لجعل النشر الإعلامي شرطًا لصحة الزواج"},{"id":"o1","text":"لحفظ الحقوق وتوثيق ما يترتب على تغيّر العلاقة الزوجية"},{"id":"o4","text":"لمنع النظر في النزاعات الأسرية نهائيًا"}],"correct_id":"o1","explanation":"ذكر الكتاب إلزام الزوج بتسجيل وقائع الطلاق والرجعة في المحكمة الشرعية.","page":104},{"id":"u03_l03_q096","lesson_id":"u03_l03","difficulty":"medium","prompt":"خلال عدة الطلاق الرجعي، ما سبب دعوة المرأة للاعتداد في بيت الزوجية؟","options":[{"id":"o4","text":"منع حق الإرث بين الزوجين"},{"id":"o2","text":"قطع كل صلة زوجية فورًا"},{"id":"o1","text":"إتاحة فرصة الرجعة واستعادة الحياة الأسرية"},{"id":"o3","text":"اعتبار الطلاق بائنًا من أول لحظة"}],"correct_id":"o1","explanation":"ذكر الكتاب استمرار العصمة وإمكان الرجعة حكمتين للبقاء في بيت الزوجية.","page":110},{"id":"u03_l03_q105","lesson_id":"u03_l03","difficulty":"medium","prompt":"لماذا لا يلغي تقدم الفحوص الطبية وجوب العدة؟","options":[{"id":"o2","text":"لأن الطب لا يبحث الحمل مطلقًا"},{"id":"o3","text":"لأن المقصد الوحيد هو معرفة السكن"},{"id":"o1","text":"لأن العدة حكم تعبدي له حكم متعددة"},{"id":"o4","text":"لأن العدة لا تتعلق بأحكام شرعية"}],"correct_id":"o1","explanation":"نبه الكتاب إلى أن إمكانية إثبات براءة الرحم لا تبطل التعبد بالعدة.","page":108},{"id":"u03_l03_q107","lesson_id":"u03_l03","difficulty":"medium","prompt":"ما الذي يميز توارث الزوجين في عدة طلاق رجعي عن عدة طلاق بائن؟","options":[{"id":"o3","text":"يثبت التوارث في البائن دون الرجعي"},{"id":"o2","text":"ينقطع التوارث في الرجعي وحده"},{"id":"o4","text":"لا علاقة للتوارث باستمرار الزوجية"},{"id":"o1","text":"يبقى التوارث في الرجعي ولا يكون في البائن"}],"correct_id":"o1","explanation":"يربط الدرس الإرث ببقاء رباط الزوجية في الرجعي.","page":110},{"id":"u03_l03_q113","lesson_id":"u03_l03","difficulty":"medium","prompt":"لماذا لا تتوقف عدة المتوفى عنها زوجها غير الحامل على حصول الدخول؟","options":[{"id":"o1","text":"لأن الحكم في الجدول يشمل الحالتين"},{"id":"o4","text":"لأن سبب العدة هو عدد الأولاد فقط"},{"id":"o3","text":"لأن العدة لا تشرع عند الوفاة"},{"id":"o2","text":"لأن العدة تنتهي دائمًا فور الوفاة"}],"correct_id":"o1","explanation":"نص جدول العدة بسبب الوفاة على شمول غير الحامل للمدخول بها وغير المدخول بها.","page":109},{"id":"u03_l03_q116","lesson_id":"u03_l03","difficulty":"medium","prompt":"ما حالة الاستثناء التي تسمح للمعتدة من وفاة زوجها بالمبيت عند أهلها؟","options":[{"id":"o1","text":"إذا كانت لا تأمن على نفسها وهي وحدها في بيت الزوجية"},{"id":"o3","text":"إذا أرادت إلغاء الحداد نهائيًا"},{"id":"o4","text":"إذا انتهى يوم عملها مبكرًا"},{"id":"o2","text":"إذا رغبت بتغيير المكان كل ليلة دون حاجة"}],"correct_id":"o1","explanation":"أجاز الدرس المبيت عند الأهل حال عدم الأمن أو الوحدة دون محرم في البيت.","page":111},{"id":"u03_l03_q117","lesson_id":"u03_l03","difficulty":"medium","prompt":"ما سبب بقاء التوارث في عدة الطلاق الرجعي بخلاف البائن؟","options":[{"id":"o4","text":"اختلاف عدد أشهر السنة"},{"id":"o2","text":"انتفاء رابطة الزوجية في النوعين"},{"id":"o3","text":"وجود عقد جديد تلقائي في البائن"},{"id":"o1","text":"استمرار رباط الزوجية حكمًا في الرجعي وانتهاؤه في البائن"}],"correct_id":"o1","explanation":"فرّق الدرس في التوارث تبعًا لبقاء الرابطة في الرجعي وانتهائها في البائن.","page":110},{"id":"u03_l03_q119","lesson_id":"u03_l03","difficulty":"hard","prompt":"أي مقارنة صحيحة بين المطلقة قبل الدخول والمتوفى عنها زوجها قبل الدخول إذا لم تكن حاملًا؟","options":[{"id":"o2","text":"كلتاهما تعتدان ثلاث حيضات"},{"id":"o4","text":"المطلقة تعتد أربعة أشهر وعشرة أيام والمتوفى عنها لا تعتد"},{"id":"o3","text":"كلتاهما لا عدة عليهما"},{"id":"o1","text":"المطلقة لا عدة عليها والمتوفى عنها زوجها تعتد أربعة أشهر وعشرة أيام"}],"correct_id":"o1","explanation":"جمع الكتاب بين نفي عدة المطلقة قبل الدخول ووجوب عدة الوفاة لغير الحامل مطلقًا.","page":108},{"id":"u03_l03_q131","lesson_id":"u03_l03","difficulty":"medium","prompt":"ما حكم تخصيص الثوب الأسود وحده للمرأة في حدادها على زوجها وفق الإثراء؟","options":[{"id":"o3","text":"يجب الثوب الأحمر عند الخروج للحاجة"},{"id":"o4","text":"يقتصر الحداد على تغيير لون الحذاء"},{"id":"o1","text":"لا يشترط لون معين من الثياب في الحداد"},{"id":"o2","text":"يجب السواد في جميع الملابس دون استثناء"}],"correct_id":"o1","explanation":"نص الإثراء على تجنب الزينة في الحداد وأنه لا يشترط لون محدد مثل السواد.","page":111},{"id":"u03_l03_q146","lesson_id":"u03_l03","difficulty":"hard","prompt":"لماذا يبقى التوارث قائمًا إذا توفي أحد الزوجين أثناء عدة الطلاق الرجعي؟","options":[{"id":"o2","text":"لأن العدة تسقط كل حقوق الزوجين"},{"id":"o4","text":"لأن التوارث لا يتعلق بالزوجية"},{"id":"o1","text":"لأن رابطة الزوجية قائمة حكمًا في مدة العدة الرجعية"},{"id":"o3","text":"لأن الطلاق البائن والرجعي متماثلان في الإرث"}],"correct_id":"o1","explanation":"ينص الدرس على ثبوت الإرث بين الزوجين في العدة الرجعية بخلاف البائن.","page":110},{"id":"u03_l03_q157","lesson_id":"u03_l03","difficulty":"medium","prompt":"لماذا تُلزم المطلقة رجعيًا بالاعتداد في بيت الزوجية وفق الشرح؟","options":[{"id":"o2","text":"لأن الطلاق الرجعي ينهي الزواج فورًا دون فرصة للمراجعة"},{"id":"o3","text":"لأنها لا تملك أي حقوق في العدة"},{"id":"o1","text":"لبقاء الرابطة الزوجية وإتاحة فرصة الإصلاح والرجعة"},{"id":"o4","text":"لإلغاء كل اتصال بالزوج أثناء العدة"}],"correct_id":"o1","explanation":"نص الكتاب على الاعتداد في بيت الزوجية لما في ذلك من إمكان الرجعة.","page":110},{"id":"u03_l03_q163","lesson_id":"u03_l03","difficulty":"medium","prompt":"أي ترتيب صحيح لأحكام عدة المطلقة قبل الدخول والمطلقة غير الحائض بعد الدخول والمطلقة الحامل؟","options":[{"id":"o3","text":"ثلاثة أشهر ثم لا عدة ثم أربعون يومًا"},{"id":"o2","text":"ثلاث حيضات ثم أربعة أشهر ثم عشرون يومًا"},{"id":"o4","text":"أربعة أشهر وعشرة أيام لجميع الحالات"},{"id":"o1","text":"لا عدة ثم ثلاثة أشهر قمرية ثم حتى وضع الحمل"}],"correct_id":"o1","explanation":"يميز جدول الدرس بين سقوط العدة قبل الدخول وعدة غير الحائض بعد الدخول وانتهاء عدة الحامل بوضع الحمل.","page":109},{"id":"u03_l03_q165","lesson_id":"u03_l03","difficulty":"medium","prompt":"بماذا يتميز ميراث الزوجين خلال عدة الطلاق الرجعي عما بعد الطلاق البائن؟","options":[{"id":"o4","text":"يصبح الميراث مشروطًا بمدة الخطبة"},{"id":"o2","text":"ينقطع التوارث في الرجعي فقط"},{"id":"o3","text":"يتساوى الحكمان دون فرق"},{"id":"o1","text":"يبقى التوارث في الرجعي ولا يكون في البائن بعد انتهاء الزوجية"}],"correct_id":"o1","explanation":"ذكر الدرس بقاء حق الإرث في الرجعي وعدم التوارث في الطلاق البائن.","page":110},{"id":"u03_l03_q166","lesson_id":"u03_l03","difficulty":"hard","prompt":"ما الوصف الصحيح لطلب الزواج من معتدة وفاة قبل انتهاء عدتها؟","options":[{"id":"o1","text":"يجوز التعريض بالخطبة لا التصريح بها ولا العقد"},{"id":"o3","text":"تحرم حتى الإشارة غير الصريحة في كل ظرف"},{"id":"o4","text":"يجوز التصريح بالخطبة دون انتظار"},{"id":"o2","text":"يجوز عقد الزواج فورًا إذا قبلت"}],"correct_id":"o1","explanation":"فرّق الكتاب بين التعريض الجائز في عدة الوفاة والتصريح الممنوع.","page":110},{"id":"u03_l03_q174","lesson_id":"u03_l03","difficulty":"medium","prompt":"توفي رجل عن زوجة غير حامل ولم يدخل بها؛ فما عدة الوفاة بحسب ا :"كلاهما يتعلق بالقراءة وحدها"},{"id":"o2","text":"الأول يمس المال والثاني يمس العرض"}],"correct_id":"o1","explanation":"صنّف الكتاب القذف اعتداء على الأعراض وأكل المال بالباطل اعتداء على الأموال.","page":142},{"id":"u04_l01_q147","lesson_id":"u04_l01","difficulty":"medium","prompt":"لماذا يُعدّ الإضرار بمرافق الماء العامة داخلًا في مضمون التحذير من الإفلاس الأخروي؟","options":[{"id":"o3","text":"لأنه لا يؤثر إلا في الممتلكات الخاصة"},{"id":"o1","text":"لأنه اعتداء على حقوق عامة ينتفع بها الناس"},{"id":"o4","text":"لأن الإضرار بها يُصلح الاقتصاد"},{"id":"o2","text":"لأن المرافق العامة لا صاحب لها"}],"correct_id":"o1","explanation":"نص الدرس على أن العبث بخطوط الماء والكهرباء والمرافق العامة اعتداء على الحقوق العامة.","page":143},{"id":"u04_l01_q156","lesson_id":"u04_l01","difficulty":"hard","prompt":"إذا اعتقد إنسان أن حسناته الشخصية تعفيه من إعادة الحقوق إلى أصحابها، فما الذي يصححه حديث المفلس؟","options":[{"id":"o1","text":"أن حقوق الناس لا تسقط بكثرة العبادات مع استمرار الاعتداء"},{"id":"o3","text":"أن الاعتداء على الحق العام ليس له أثر"},{"id":"o4","text":"أن رد الحقوق مطلوب من أصحاب المال فقط"},{"id":"o2","text":"أن ظلم الناس يُعد إحسانًا إذا صدر من متعبد"}],"correct_id":"o1","explanation":"حذر الحديث من خسارة أثر الحسنات بسبب الاعتداء على حقوق الناس.","page":143},{"id":"u04_l01_q163","lesson_id":"u04_l01","difficulty":"hard","prompt":"صاحب متجر يرفع سعر سلعة باستغلال حاجة الناس ويظلم المشترين؛ تحت أي عنوان يندرج الفعل في شرح الحديث؟","options":[{"id":"o2","text":"المداومة على صلاة التطوع"},{"id":"o3","text":"صيانة حق الطريق"},{"id":"o1","text":"أكل أموال الناس بالباطل والاعتداء على الحقوق"},{"id":"o4","text":"المساهمة في التكافل الاجتماعي"}],"correct_id":"o1","explanation":"ذكر الدرس الاستغلال ورفع الأسعار مع صور الاعتداء على الأموال.","page":142},{"id":"u04_l01_q164","lesson_id":"u04_l01","difficulty":"medium","prompt":"لماذا يعد الإيذاء المعنوي للناس ضمن المخالفات التي يحذر منها حديث المفلس؟","options":[{"id":"o4","text":"لأن الحقوق لا تشمل سمعة الإنسان"},{" :"أن حقوق الناس تسقط كلما زادت النوافل"},{"id":"o1","text":"أن أداء العبادات لا يبيح ظلم الناس وانتهاك حقوقهم"},{"id":"o4","text":"أن الاعتداء على الغير مباح مع الصدقة"},{"id":"o3","text":"أن العبادات لا شأن لها بالأخلاق أبدًا"}],"correct_id":"o1","explanation":"بين الدرس أن كثرة الحسنات لا تمنع استيفاء حقوق المظلومين.","page":142},{"id":"u04_l01_q185","lesson_id":"u04_l01","difficulty":"medium","prompt":"لماذا يكون وفاء المظالم في الآخرة بالحسنات والسيئات لا بالمال الدنيوي؟","options":[{"id":"o2","text":"لأن المال شرط لقبول الحساب في الآخرة"},{"id":"o3","text":"لأن الحقوق تسقط تلقائيًا بعد الموت"},{"id":"o4","text":"لأن صاحب المال وحده يُسأل عن سلوكه"},{"id":"o1","text":"لأن الجزاء الأخروي يختلف عن وسائل الوفاء في الحياة الدنيا"}],"correct_id":"o1","explanation":"نص الدرس على أن وفاء الحقوق يوم القيامة لا يكون بالدرهم والدينار.","page":143},{"id":"u04_l02_q108","lesson_id":"u04_l02","difficulty":"medium","prompt":"كيف يسهم رفض التقليد الأعمى والخرافات في حفظ العقل؟","options":[{"id":"o2","text":"بتعطيل التفكير في الوقائع"},{"id":"o3","text":"بمنع طلب العلم النافع"},{"id":"o1","text":"بإتاحة التفكير الواعي بعيدًا عن الأوهام والتصورات الفاسدة"},{"id":"o4","text":"بالاستعاضة عن الأدلة بالشائعات"}],"correct_id":"o1","explanation":"دعا الدرس إلى تحرير العقل من الأوهام والتعصب والتقليد الأعمى.","page":148},{"id":"u04_l02_q113","lesson_id":"u04_l02","difficulty":"medium","prompt":"أي وسيلة لحفظ الدين تُظهر أهمية الأسلوب الحكيم في التعامل مع الناس؟","options":[{"id":"o3","text":"ترك تعليم أركان الإيمان"},{"id":"o4","text":"حصر عبادة الله في العادات الاجتماعية"},{"id":"o2","text":"إلغاء الحوار مع المخالف"},{"id":"o1","text":"الدعوة بالحكمة والموعظة الحسنة"}],"correct_id":"o1","explanation":"ذكر الدرس الدعوة بالحكمة والموعظة الحسنة وسيلة لحفظ الدين.","page":146},{"id":"u04_l02_q120","lesson_id":"u04_l02","difficulty":"hard","prompt":"ما التوصيف الصحيح لعملٍ يرفع الحرج عن المسافر دون أن يتوقف عليه أصل حفظ الدين؟","options":[{"id":"o2","text":"مصلحة ضرورية ينهدم أصل الحياة دون  امتلاك المال محرّم"},{"id":"o1","text":"ليكون اكتساب المال مشروعًا مع صيانة حقوق الآخرين"},{"id":"o4","text":"لأن الغاية تبيح أي وسيلة لكسب المال"},{"id":"o3","text":"لأن العمل يعفي صاحبه من حقوق الناس"}],"correct_id":"o1","explanation":"بيّن الدرس مشروعية السعي للكسب ووجوب تجنب أخذ المال بطرق غير مشروعة.","page":149},{"id":"u04_l02_q130","lesson_id":"u04_l02","difficulty":"medium","prompt":"لماذا لا تُعد آداب الطعام والشراب من الضروريات في هذا التقسيم؟","options":[{"id":"o2","text":"لأن الالتزام بها يمنع تناول الطعام"},{"id":"o1","text":"لأنها من التحسينيات التي تكمّل السلوك وتزيده حسنًا"},{"id":"o3","text":"لأنها تُسقط وجوب حفظ النفس"},{"id":"o4","text":"لأنها تُعد من الرخص الخاصة بالسفر"}],"correct_id":"o1","explanation":"أورد الكتاب الأخذ بآداب الطعام والشراب ضمن أمثلة التحسينيات.","page":150},{"id":"u04_l02_q142","lesson_id":"u04_l02","difficulty":"medium","prompt":"كيف ترتبط الدعوة بالحكمة والموعظة الحسنة بمقصد حفظ الدين؟","options":[{"id":"o4","text":"تمنع توضيح الأحكام للناس"},{"id":"o3","text":"تجعل التدين شأنًا لا يتصل بالأخلاق"},{"id":"o2","text":"تستبدل أداء العبادات بالحوار فقط"},{"id":"o1","text":"تدعو إلى الإيمان والالتزام بوسيلة مناسبة"}],"correct_id":"o1","explanation":"عدّ الكتاب الدعوة بالحكمة والموعظة الحسنة ضمن وسائل حفظ الدين.","page":146},{"id":"u04_l02_q145","lesson_id":"u04_l02","difficulty":"medium","prompt":"عامل يحصل على رزقه بجهده الحلال ويبتعد عن الرشوة؛ أي مقصد يحققه السلوكان معًا؟","options":[{"id":"o3","text":"حفظ النفس عن طريق السفر"},{"id":"o1","text":"حفظ المال باكتسابه المشروع وحمايته من الفساد"},{"id":"o4","text":"مرتبة التحسينيات فقط"},{"id":"o2","text":"حفظ النسل فقط"}],"correct_id":"o1","explanation":"جمع الدرس تحت حفظ المال بين الحث على العمل المشروع وتحريم أخذ الأموال بغير حق.","page":149},{"id":"u04_l02_q146","lesson_id":"u04_l02","difficulty":"hard","prompt":"لماذا لا يؤدي غياب بعض الرخص الشرعية إلى زوال أصل المقاصد مع أنه يشق على الناس؟","options":[{"id":"o4","text":"لأن مشقة الناس لا تُراعى أصلًا"},{"id":"o2","text":"ل anation":"عرض الدرس الوصايا العامة في حجة الوداع بوصفها توجيهات لحماية الحقوق.","page":160},{"id":"u04_l04_q152","lesson_id":"u04_l04","difficulty":"hard","prompt":"بماذا يُستدل من مساواة حرمة الدماء والأموال والأعراض بحرمة الزمان والمكان في الخطبة؟","options":[{"id":"o1","text":"التأكيد البالغ على صيانة حقوق الإنسان"},{"id":"o2","text":"أن حرمة المكان تُلغي حقوق الناس"},{"id":"o3","text":"أن المال وحده هو المحترم دون الإنسان"},{"id":"o4","text":"أن النصيحة لا صلة لها بالأمن العام"}],"correct_id":"o1","explanation":"أبرز الدرس تشبيه حرمة الحقوق بحرمة اليوم والبلد والشهر.","page":161},{"id":"u04_l04_q154","lesson_id":"u04_l04","difficulty":"medium","prompt":"ما المقصود بإبطال ربا العباس رضي الله عنه في وصايا حجة الوداع؟","options":[{"id":"o3","text":"أن الربا يبقى مشروعًا إذا اتصل بالأسرة"},{"id":"o2","text":"أنه استثنى أقرباءه من النهي عن الربا"},{"id":"o1","text":"أن النبي ﷺ بدأ بأقربائه ليكون تطبيق الحكم قدوة للجميع"},{"id":"o4","text":"أن المال لا يخضع لأي حكم شرعي"}],"correct_id":"o1","explanation":"أكد الدرس بدء النبي ﷺ بإبطال ربا عمه ليضرب المثال في الالتزام.","page":162},{"id":"u04_l04_q157","lesson_id":"u04_l04","difficulty":"medium","prompt":"أي أسلوب خطابي يستعمل حين يوجّه المتحدث سؤالًا إلى سامعيه ويتيح مشاركتهم في الجواب؟","options":[{"id":"o4","text":"الابتعاد عن كل مثال وتشبيه"},{"id":"o3","text":"تقديم خطاب لا يفهمه المخاطب"},{"id":"o2","text":"إلغاء دور المستمع نهائيًا"},{"id":"o1","text":"الحوار والتشويق بإشراك الجمهور"}],"correct_id":"o1","explanation":"عدّ الكتاب السؤال والحوار من أساليب تأثير خطبة حجة الوداع.","page":164},{"id":"u04_l04_q164","lesson_id":"u04_l04","difficulty":"hard","prompt":"ما الفرق بين معالجة الربا الموروث من الجاهلية والالتزام بحقوق الناس في وصايا النبي ﷺ؟","options":[{"id":"o4","text":"إباحة الاستيلاء على أموال الضعفاء"},{"id":"o1","text":"إبطال الربا الجاهلي مع تثبيت العدل وعدم التعدي على الأموال"},{"id":"o3","text":"جعل حق الدائن مفتوحًا دون قيود"},{"id":"o2","text":"إجازة كل زيادة ربوية لمن كان صاحب سلطة"}],"correct_id":"o1","explanation":"ذكر الدرس إبطال الربا الجاهلي بوصفه حماية للحقوق المالية.","page":161},{"id":"u04_l04_q176","lesson_id":"u04_l04","difficulty":"medium","prompt":"لماذا بدأ النبي ﷺ بإبطال معاملة ربوية تخص قريبًا له؟","options":[{"id":"o2","text":"ليسمح لأقاربه باستثناءات مالية"},{"id":"o3","text":"ليقرر أن الأحكام تخص غير الأقارب"},{"id":"o4","text":"ليثبت أن المعاملات المالية بلا مسؤولية"},{"id":"o1","text":"ليكون قدوة في تطبيق الأحكام قبل مطالبة الآخرين بها"}],"correct_id":"o1","explanation":"استدل الكتاب بإبطال ربا العباس على القدوة في الالتزام بالأحكام العامة.","page":162},{"id":"u04_l04_q178","lesson_id":"u04_l04","difficulty":"medium","prompt":"عندما استعمل النبي ﷺ أسلوب التشبيه بقدسية الزمان والمكان، ماذا أراد تحقيقه؟","options":[{"id":"o1","text":"تقريب معنى حرمة الحقوق إلى أذهان السامعين"},{"id":"o4","text":"حصر الحقوق في مكان وزمان واحد"},{"id":"o2","text":"صرف السامعين عن موضوع الخطبة"},{"id":"o3","text":"إلغاء الحاجة إلى فهم مضمون الخطاب"}],"correct_id":"o1","explanation":"صنّف الكتاب التشبيه ضمن وسائل الإبلاغ المؤثرة في خطبة حجة الوداع.","page":164},{"id":"u04_l04_q182","lesson_id":"u04_l04","difficulty":"hard","prompt":"رأى شخص أن مكانة الإنسان تستمد من نسبه أو لونه، فأي معيار للمفاضلة يرد عليه من وصايا حجة الوداع؟","options":[{"id":"o2","text":"الثراء ومكانة الأسرة وحدهما"},{"id":"o4","text":"السلطة السياسية مع إهمال الأخلاق"},{"id":"o3","text":"الانتماء القبلي بغض النظر عن العمل"},{"id":"o1","text":"التقوى والعمل الصالح لا الأصل واللون"}],"correct_id":"o1","explanation":"أكد النبي ﷺ في وصايا حجة الوداع أن التفاضل عند الله بالتقوى والعمل الصالح لا بالنسب أو اللون.","page":161},{"id":"u04_l04_q183","lesson_id":"u04_l04","difficulty":"medium","prompt":"ما القيمة التي يؤكدها إبطال بعض عادات الجاهلية في وصايا حجة الوداع؟","options":[{"id":"o1","text":"إقامة العلاقات على الحق والعدل بدل الظلم والثأر"},{"id":"o3","text":"تقديم العصبية على حقوق الآخرين"},{"id":"o4","text":"إعفاء الأقوياء من الواجبات"},{"id":"o2","text":"إحياء المظالم القديمة بوصفها حقًا دائمًا"}],"correct_id":"o1","explanation":"تناول الكتاب إبطال النبي ﷺ للعادات الجاهلية الضارة وترسيخ العدل.","page":161},{"id":"u04_l04_q187","lesson_id":"u04_l04","difficulty":"medium","prompt":"لماذا كان النداء المتكرر للناس في خطبة حجة الوداع أسلوبًا مؤثرًا؟","options":[{"id":"o2","text":"لمنع الناس من متابعة الحديث"},{"id":"o3","text":"لأن الخطبة اقتصرت على سؤال لغوي"},{"id":"o1","text":"لاستدعاء الانتباه قبل إبلاغ الوصايا المهمة"},{"id":"o4","text":"لأنه يغني عن بيان مضمون الوصية"}],"correct_id":"o1","explanation":"ذكر الكتاب أسلوب النداء لجذب انتباه المخاطبين.","page":164},{"id":"u04_l04_q188","lesson_id":"u04_l04","difficulty":"hard","prompt":"خطيب يشرح حقًا عظيمًا بعبارات قليلة جامعة بدل إطالة تشتت المستمعين؛ أي أسلوب نبوي يطبقه من شرح خطبة الوداع؟","options":[{"id":"o1","text":"الإيجاز والاختصار بعبارات بليغة مؤثرة"},{"id":"o2","text":"الإكثار من التكرار الذي يحجب المعنى"},{"id":"o3","text":"إلغاء الأمثلة والوصايا من الخطبة"},{"id":"o4","text":"حصر الخطاب في أسماء الأماكن دون هدف"}],"correct_id":"o1","explanation":"عدّ الكتاب الإيجاز والاختصار من الأساليب المؤثرة في وصايا حجة الوداع.","page":164},{"id":"u04_l05_q108","lesson_id":"u04_l05","difficulty":"medium","prompt":"بأي وجه عُدّ وصف السيدة خديجة رضي الله عنها للنبي ﷺ نموذجًا للمسؤولية المجتمعية؟","options":[{"id":"o1","text":"إبرازه صلة الرحم ومساعدة الضعيف وإكرام الضيف"},{"id":"o2","text":"تشجيعه على ترك صلاته بالناس"},{"id":"o4","text":"حصر الخير في منافع الأقارب المادية"},{"id":"o3","text":"الدعوة إلى الانعزال عن المجتمع"}],"correct_id":"o1","explanation":"أورد الكتاب وصف خديجة رضي الله عنها لإحسانه ﷺ للناس.","page":169},{"id":"u04_l05_q115","lesson_id":"u04_l05","difficulty":"medium","prompt":"مجموعة تدقّق إشاعة قبل نشرها لحماية استقرار مجتمعها؛ أي صورة للمسؤولية تمارس؟","options":[{"id":"o4","text":"حصر المسؤولية في التبرع المالي"},{"id":"o3","text":"التخلي عن المصالح العامة"},{"id":"o2","text":"تقوية الشائعات لتحقيق الشهرة"},{"id":"o1","text":"المحافظة على أمن المجتمع والتصدي للشائعات"}],"correct_i ن الشركات غير معنية بالمجتمع"},{"id":"o2","text":"لأن الربح المالي أصبح ممنوعًا دائمًا"}],"correct_id":"o1","explanation":"أوضح الدرس أن المسؤولية الحديثة للشركات تشمل خدمة المجتمع ومكافحة التلوث والتزامات أخلاقية.","page":170},{"id":"u04_l05_q132","lesson_id":"u04_l05","difficulty":"medium","prompt":"لماذا يعد الشعور بالرضا عن أداء خدمة نافعة دافعًا للمسؤولية المجتمعية؟","options":[{"id":"o4","text":"لأنه يقتضي تجاهل حاجات الآخرين"},{"id":"o3","text":"لأنه يجعل العمل النافع غير مهم"},{"id":"o2","text":"لأنه يغني عن كل واجب اجتماعي"},{"id":"o1","text":"لأنه يعزز تقدير الفرد لذاته وإحساسه بدوره الإيجابي"}],"correct_id":"o1","explanation":"ذكر الدرس تقدير الذات والشعور بالدور الإيجابي من دوافع المسؤولية المجتمعية.","page":167},{"id":"u04_l05_q134","lesson_id":"u04_l05","difficulty":"medium","prompt":"نظّمت مجموعة أيامًا طبية مجانية للمحتاجين؛ أي صورة للمسؤولية المجتمعية جسدتها؟","options":[{"id":"o2","text":"نشر الخصومة بين الناس"},{"id":"o1","text":"المساعدة على توفير الرعاية الصحية للفئات المحتاجة"},{"id":"o3","text":"منع التكافل الاجتماعي"},{"id":"o4","text":"الاكتفاء بإعلان تجاري غير نافع"}],"correct_id":"o1","explanation":"ذكر الدرس الأيام الطبية المجانية ضمن صور مساعدة الضعفاء والمحتاجين.","page":168},{"id":"u04_l05_q136","lesson_id":"u04_l05","difficulty":"medium","prompt":"أي عمل تطوعي يرتبط مباشرة بحفظ الموارد البيئية؟","options":[{"id":"o2","text":"إهدار المياه في المرافق العامة"},{"id":"o3","text":"إتلاف الأشجار عمدًا"},{"id":"o4","text":"إهمال تنظيف الأماكن المشتركة"},{"id":"o1","text":"المشاركة في مشروعات المحافظة على المياه"}],"correct_id":"o1","explanation":"ذكر الدرس الحفاظ على المياه وموارد البيئة من أوجه التطوع النافع.","page":168},{"id":"u04_l05_q138","lesson_id":"u04_l05","difficulty":"hard","prompt":"عند انتشار إشاعة تثير الخوف بين السكان، أي سلوك ينسجم مع مسؤولية الفرد تجاه أمن مجتمعه؟","options":[{"id":"o3","text":"تضخيم الأنباء المجهولة"},{"id":"o2","text":"تكرار الإشاعة دون تحقق"},{"id":"o1","text":"التحقق من الأخبار والتصدي للأكاذيب التي تضر <script>
const blocks=[...document.querySelectorAll('template')].map(node=>node.content.textContent);
const status=document.querySelector('#status');
const manual=document.querySelector('#manual-copy');
document.addEventListener('click',async event=>{
 const button=event.target.closest('[data-copy]');
 if(!button)return;
 const key=button.dataset.copy;
 const sql=key==='all'?blocks.join(''):blocks[Number(key)];
 manual.hidden=true;
 try{
  await navigator.clipboard.writeText(sql);
  status.textContent='تم النسخ. الصق النص في Supabase واضغط Run.';
 }catch{
  manual.value=sql;
  manual.hidden=false;
  manual.focus();
  manual.select();
  status.textContent='المتصفح منع النسخ التلقائي. النص محدد وجاهز للنسخ اليدوي.';
 }
});
</script></main></body></html>
