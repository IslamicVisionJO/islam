<template id="sql-0">begin;
create table if not exists school_private.wall_lessons(
 id text primary key, first_page int not null, last_page int not null
);
create table if not exists school_private.wall_questions(
 id text primary key, lesson_id text not null references school_private.wall_lessons(id),
 difficulty text not null check(difficulty in ('easy','medium','hard')),
 prompt text not null, options jsonb not null, correct_id text not null, explanation text not null,
 page int not null, enabled boolean not null default true
);
create table if not exists school_private.wall_rounds(
 id uuid primary key default gen_random_uuid(), user_id uuid not null references auth.users(id) on delete cascade,
 questions jsonb not null, level text not null, unit_id text not null, lesson_id text not null,
 phase text not null default 'playing', position int not null default 0, score int not null default 0,
 streak int not null default 0, best int not null default 0, correct int not null default 0,
 height numeric not null default 0.1, speed numeric not null, elapsed numeric not null default 0,
 mark timestamptz not null, freeze_until timestamptz, created_at timestamptz not null default clock_timestamp(),
 finished_at timestamptz, reason text, hidden boolean not null default false,
 receipts jsonb not null default '[]'
);
create unique index if not exists wall_one_open_round on school_private.wall_rounds(user_id) where finished_at is null;
create index if not exists wall_rank_results on school_private.wall_rounds(finished_at,user_id,score desc) where not hidden and reason in ('danger','complete');
alter table school_private.wall_lessons enable row level security;
alter table school_private.wall_questions enable row level security;
alter table school_private.wall_rounds enable row level security;
revoke all on school_private.wall_rounds,school_private.wall_questions,school_private.wall_lessons from public,anon,authenticated;

create or replace function school_private.wall_snapshot(r school_private.wall_rounds,t timestamptz) returns jsonb
language sql stable set search_path='' as $$
 select jsonb_build_object('id',r.id,'phase',r.phase,'index',r.position,'total',jsonb_array_length(r.questions),
 'level',r.level,'unit',r.unit_id,'lesson',r.lesson_id,'score',r.score,'streak',r.streak,'best',r.best,'correct',r.correct,
 'height',r.height,'speed',r.speed,'elapsed',r.elapsed,'reason',r.reason,
 'delay',greatest(0,extract(epoch from r.mark-t)),
 'freeze',coalesce(greatest(0,extract(epoch from r.freeze_until-t)),0),
 'question',case when r.phase='playing' then (r.questions-&gt;r.position)-'correct_id'-'explanation' else null end,
 'feedback',case when r.phase='feedback' then r.receipts-&gt;-1 else null end,
 'receipts',case when r.phase='finished' then r.receipts else null end,
 'personalBest',case when r.phase='finished' then greatest(r.score,coalesce((select max(score) from school_private.wall_rounds where user_id=r.user_id and reason in ('complete','danger') and not hidden),0)) end);
$$;
revoke all on function school_private.wall_snapshot(school_private.wall_rounds,timestamptz) from public,anon,authenticated;

create or replace function public.wall_start(p_level text,p_unit text,p_lesson text) returns jsonb
language plpgsql security definer set search_path='' as $$
declare u uuid; r school_private.wall_rounds; qs jsonb; t timestamptz;
begin
 u:=school_private.duel_identity();
 if p_level is null or p_level not in ('easy','medium','hard') or p_unit is null or p_unit !~ '^(all|u0[1-4])$'
 or p_lesson is null or (p_lesson&lt;&gt;'all' and not exists(select 1 from school_private.wall_lessons where id=p_lesson and (p_unit='all' or left(id,3)=p_unit))) then
  raise exception 'wall_invalid_scope';
 end if;
 perform pg_advisory_xact_lock(hashtextextended(u::text,811));
 t:=clock_timestamp();
 update school_private.wall_rounds set phase='finished',finished_at=t,reason='abandoned'
  where user_id=u and finished_at is null and created_at&lt;t-interval '2 hours';
 select * into r from school_private.wall_rounds where user_id=u and finished_at is null;
 if found then return school_private.wall_snapshot(r,t); end if;
 -- Difficulty preference is explicit; where it is missing only the selected scope can supply alternatives.
 select jsonb_agg(jsonb_set(to_jsonb(q)-'enabled'-'priority'-'rnd','{options}',
     (select jsonb_agg(o order by random()) from jsonb_array_elements(q.options) o)) order by priority,rnd) into qs from
  (select w.*,case when difficulty=p_level then 0 when difficulty='medium' then 1 else 2 end priority,random() rnd
   from school_private.wall_questions w where enabled
    and (p_unit='all' or left(lesson_id,3)=p_unit) and (p_lesson='all' or lesson_id=p_lesson)
   order by priority,rnd limit 40) q;
 if qs is null then raise exception 'wall_no_questions';end if;
 insert into school_private.wall_rounds(user_id,questions,level,unit_id,lesson_id,speed,mark)
  values(u,qs,p_level,p_unit,p_lesson,case p_level when 'easy' then .034 when 'medium' then .046 else .06 end,t+interval '3 seconds') returning * into r;
 return school_private.wall_snapshot(r,t);
end;
$$;

create or replace function public.wall_act(p_id uuid,p_action text,p_question text default null,p_option text default null) returns jsonb
language plpgsql security definer set search_path='' as $$
declare u uuid; r school_private.wall_rounds; t timestamptz; dt numeric; moving numeric; q jsonb; ok boolean; remaining numeric;
begin
 u:=school_private.duel_identity();
 if p_action is null or p_action not in ('state','answer','next','pause','resume','exit') then raise exception 'wall_invalid_action';end if;
 if p_id is null and p_action&lt;&gt;'state' then raise exception 'wall_round_required';end if;
 select * into r from school_private.wall_rounds
  where user_id=u and (id=p_id or (p_id is null and finished_at is null)) order by created_at desc limit 1 for update;
 if not found then
  if p_id is null then return null;end if;
  raise exception 'wall_round_unavailable' using errcode='42501';
 end if;
 t:=clock_timestamp();
 if r.finished_at is not null then return school_private.wall_snapshot(r,t);end if;
 if t-r.created_at&gt;interval '2 hours' then
  r.phase:='finished';r.finished_at:=t;r.reason:='abandoned';
 elsif r.phase='playing' and t&gt;=r.mark then
  dt:=extract(epoch from t-r.mark);
  moving:=greatest(0,extract(epoch from t-greatest(r.mark,coalesce(r.freeze_until,r.mark))));
  remaining:=(1-r.height)/r.speed;
  r.elapsed:=r.elapsed+dt-greatest(0,moving-remaining);
  r.height:=least(1,r.height+moving*r.speed);
  r.mark:=t;
  if r.height&gt;=1 then r.phase:='finished';r.finished_at:=t;r.reason:='danger';end if;
 end if;
 if r.finished_at is null and p_action='answer' and r.phase='playing' and t&gt;=r.mark then
  q:=r.questions-&gt;r.position;
  if q-&gt;&gt;'id'=p_question and exists(select 1 from jsonb_array_elements(q-&gt;'options') o where o-&gt;&gt;'id'=p_option) then
   ok:=q-&gt;&gt;'correct_id'=p_option;
   r.receipts:=r.receipts||jsonb_build_object('id',p_question,'prompt',q-&gt;&gt;'prompt','choice',p_option,
     'answer',(select o-&gt;&gt;'text' from jsonb_array_elements(q-&gt;'options') o where o-&gt;&gt;'id'=q-&gt;&gt;'correct_id'),
     'explanation',q-&gt;&gt;'explanation','page',q-&gt;&gt;'page','correct',ok);
   if ok then
    r.correct:=r.correct+1;r.streak:=r.streak+1;r.best:=greatest(r.best,r.streak);
    r.score:=r.score+100+case r.streak when 3 then 50 when 5 then 100 else 0 end;
    r.speed:=greatest(least(.063,.018+r.correct*.0012),r.speed*.85);
    r.height:=greatest(.03,r.height-.085-case when r.streak=5 then .13 else 0 end);
   else
    r.streak:=0;r.speed:=least(.14,r.speed*1.10);r.height:=least(.99,r.height+.032);
   end if;
   r.freeze_until:=null;r.phase:='feedback';
  end if;
 elsif r.finished_at is null and p_action='next' and r.phase='feedback' then
  if r.position+1&gt;=jsonb_array_length(r.questions) then
   r.phase:='finished';r.finished_at:=t;r.reason:='complete';
  else
   r.position:=r.position+1;r.phase:='playing';r.mark:=t;
   if r.streak=10 then r.freeze_until:=t+interval '3 seconds';end if;
  end if;
 elsif r.finished_at is null and p_action='pause' and r.phase='playing' then
  r.phase:='paused';r.mark:=t;
 elsif r.finished_at is null and p_action='resume' and r.phase='paused' then
  remaining:=coalesce(greatest(0,extract(epoch from r.freeze_until-r.mark)),0);
  r.phase:='playing';r.mark:=t+interval '3 seconds';
  r.freeze_until:=case when remaining&gt;0 then r.mark+make_interval(secs=&gt;remaining::double precision) end;
 elsif r.finished_at is null and p_action='exit' then
  r.phase:='finished';r.finished_at:=t;r.reason:='abandoned';
 end if;
 update school_private.wall_rounds set phase=r.phase,position=r.position,score=r.score,streak=r.streak,best=r.best,
 correct=r.correct,height=r.height,speed=r.speed,elapsed=r.elapsed,mark=r.mark,freeze_until=r.freeze_until,
 finished_at=r.finished_at,reason=r.reason,receipts=r.receipts where id=r.id;
 return school_private.wall_snapshot(r,t);
end;
$$;

create or replace function public.wall_board(p_period text) returns jsonb
language plpgsql stable security definer set search_path='' as $$
declare cutoff timestamptz;
begin
 cutoff:=case p_period when 'day' then date_trunc('day',now() at time zone 'Asia/Amman') at time zone 'Asia/Amman'
 when 'week' then date_trunc('week',now() at time zone 'Asia/Amman') at time zone 'Asia/Amman'
 when 'all' then '-infinity'::timestamptz else null end;
 if cutoff is null then raise exception 'wall_invalid_period';end if;
 if not exists(select 1 from school_private.wall_questions) then raise exception 'wall_no_questions';end if;
 return coalesce((select jsonb_agg(to_jsonb(r) order by rank) from (
  select row_number() over(order by score desc,accuracy desc,elapsed desc,finished_at asc) rank,name,score,accuracy,round(elapsed,1) elapsed
  from (
   select distinct on (w.user_id) w.score,w.elapsed,w.finished_at,
    case when s.display_name is null or s.display_name like '%@%' then 'طالب' else left(s.display_name,64) end name,
    round(100.0*w.correct/greatest(1,jsonb_array_length(w.receipts)),1) accuracy
   from school_private.wall_rounds w join public.student_profiles s on s.id=w.user_id
   join public.allowed_accounts a on a.email=lower(btrim(s.email)) and a.enabled
   where not hidden and reason in ('complete','danger') and score&gt;0 and finished_at&gt;=cutoff
   order by w.user_id,w.score desc,accuracy desc,w.elapsed desc,w.finished_at asc
  ) best order by rank limit 20
 ) r),'[]'::jsonb);
end;
$$;

create or replace function public.wall_admin(p_action text,p_data jsonb default '{}') returns jsonb
language plpgsql security definer set search_path='' as $$
declare code text; lesson text; diff text; stem text; why text; opts jsonb; answer text; page_no int; allowed boolean;
begin
 if not school_private.is_admin() then raise exception 'wall_admin_required' using errcode='42501';end if;
 if p_action='questions' then
  return coalesce((select jsonb_agg(to_jsonb(q) order by id) from school_private.wall_questions q),'[]'::jsonb);
 elsif p_action='results' then
  return coalesce((select jsonb_agg(to_jsonb(w)) from
   (select r.id,r.score,r.finished_at,r.hidden,case when p.display_name like '%@%' then 'طالب' else p.display_name end name
    from school_private.wall_rounds r join public.student_profiles p on p.id=r.user_id
    where r.reason in ('complete','danger') order by r.finished_at desc limit 100) w),'[]'::jsonb);
 elsif p_action='visibility' then
  if jsonb_typeof(p_data-&gt;'hidden') is distinct from 'boolean' then raise exception 'wall_invalid_fields';end if;
  update school_private.wall_rounds set hidden=(p_data-&gt;&gt;'hidden')::boolean
  where id=(p_data-&gt;&gt;'id')::uuid and reason in ('complete','danger');
 elsif p_action='delete' then
  delete from school_private.wall_questions where id=p_data-&gt;&gt;'id';
 elsif p_action='save' then
  code:=coalesce(nullif(p_data-&gt;&gt;'id',''),'custom-'||gen_random_uuid()::text);
  lesson:=p_data-&gt;&gt;'lesson_id';diff:=p_data-&gt;&gt;'difficulty';stem:=btrim(p_data-&gt;&gt;'prompt');why:=btrim(p_data-&gt;&gt;'explanation');
  opts:=p_data-&gt;'options';answer:=p_data-&gt;&gt;'correct_id';page_no:=(p_data-&gt;&gt;'page')::int;allowed:=(p_data-&gt;&gt;'enabled')::boolean;
  if char_length(code)&gt;64 or diff is null or diff not in ('easy','medium','hard') or
   stem is null or char_length(stem) not between 5 and 500 or why is null or char_length(why) not between 5 and 1200 or
   allowed is null or jsonb_typeof(opts) is distinct from 'array' or
   not exists(select 1 from school_private.wall_lessons where id=lesson and page_no between first_page and last_page) then raise exception 'wall_invalid_fields';end if;
  if jsonb_array_length(opts)&lt;&gt;4 or answer not in ('1','2','3','4') or answer is null or
   (select count(distinct o-&gt;&gt;'id') from jsonb_array_elements(opts) o)&lt;&gt;4 or
   (select count(distinct btrim(o-&gt;&gt;'text')) from jsonb_array_elements(opts) o)&lt;&gt;4 or
   exists(select 1 from jsonb_array_elements(opts) o where (o-&gt;&gt;'id') not in ('1','2','3','4') or
    jsonb_typeof(o-&gt;'text') is distinct from 'string' or char_length(btrim(o-&gt;&gt;'text')) not between 1 and 400)
   then raise exception 'wall_invalid_options';end if;
  if (stem||opts::text) ~ '(الدرس|الدروس|الخريطة التنظيمية|الفقرة السابقة|النص أعلاه)' then raise exception 'wall_context_required';end if;
  perform pg_advisory_xact_lock(hashtextextended('wall-admin-questions',812));
  if exists(select 1 from school_private.wall_questions q where q.id&lt;&gt;code and
    regexp_replace(q.prompt,'[[:space:][:punct:]ًٌٍَُِّْـ]','','g')=regexp_replace(stem,'[[:space:][:punct:]ًٌٍَُِّْـ]','','g')) then
   raise exception 'wall_invalid_duplicate';
  end if;
  insert into school_private.wall_questions(id,lesson_id,difficulty,prompt,options,correct_id,explanation,page,enabled)
   select code,lesson,diff,stem,jsonb_agg(jsonb_build_object('id',o-&gt;&gt;'id','text',btrim(o-&gt;&gt;'text'))),answer,why,page_no,allowed
   from jsonb_array_elements(opts) o
   on conflict(id) do update set lesson_id=excluded.lesson_id,difficulty=excluded.difficulty,prompt=excluded.prompt,options=excluded.options,
   correct_id=excluded.correct_id,explanation=excluded.explanation,page=excluded.page,enabled=excluded.enabled;
 else raise exception 'wall_invalid_action';end if;
 return 'true'::jsonb;
end;
$$;

revoke all on function public.wall_start(text,text,text),public.wall_act(uuid,text,text,text),public.wall_board(text),public.wall_admin(text,jsonb) from public,anon,authenticated;
grant execute on function public.wall_start(text,text,text),public.wall_act(uuid,text,text,text),public.wall_admin(text,jsonb) to authenticated;
grant execute on function public.wall_board(text) to anon,authenticated;
commit;

01","difficulty":"medium","prompt":"لماذا تكرر نداء «ربنا» في أدعية الآية الأخيرة من سورة البقرة وفق الشرح؟","options":[{"id":"o4","text":"لإثبات أن الدعاء يغني عن الطاعة"},{"id":"o1","text":"لإظهار التذلل والإلحاح في طلب الاستجابة"},{"id":"o2","text":"للتقليل من أهمية الدعاء"},{"id":"o3","text":"للدلالة على استقلال الإنسان عن ربه"}],"correct_id":"o1","explanation":"عدّ الكتاب تكرار النداء من آداب الدعاء الدالة على التذلل والرغبة والإلحاح.","page":11},{"id":"u01_l01_q123","lesson_id":"u01_l01","difficulty":"hard","prompt":"قال طالب: «الله يعلم النيات، ولذلك يُحاسَب الإنسان على كل خاطر عابر». ما موضع الخلل في استنتاجه؟","options":[{"id":"o2","text":"اعتقد أن الله يعلم السرائر"},{"id":"o1","text":"تجاهل تجاوز الله عن حديث النفس ما لم يتحول إلى قول أو عمل"},{"id":"o4","text":"ذكر أن المحاسبة تشمل الأعمال الظاهرة"},{"id":"o3","text":"ربط النية بسلوك الإنسان"}],"correct_id":"o1","explanation":"يفرق الدرس بين إحاطة علم الله بالخواطر وبين عدم المؤاخذة على ما لم يُعمل به أو يُتكلّم.","page":8},{"id":"u01_l01_q129","lesson_id":"u01_l01","difficulty":"medium","prompt":"أي تمييز أدق بين طلب العفو وطلب الرحمة في أدعية آخر سورة البقرة؟","options":[{"id":"o1","text":"العفو طلب ترك المؤاخذة والرحمة طلب الإحسان والفضل"},{"id":"o4","text":"العفو طلب التشديد والرحمة طلب العقوبة"},{"id":"o2","text":"العفو طلب النصر والرحمة طلب البيان"},{"id":"o3","text":"العفو طلب المال والرحمة طلب الصحة"}],"correct_id":"o1","explanation":"تتضمن أدعية الآية طلب التجاوز عن الذنب وطلب الفضل والإحسان.","page":11},{"id":"u01_l01_q135","lesson_id":"u01_l01","difficulty":"medium","prompt":"من قال إنه يصدق رسالة محمد ﷺ لكنه يرفض الاعتراف برسالة رسول سابق، ما الذي خالفه؟","options":[{"id":"o4","text":"يسر التكاليف الشرعية"},{"id":"o3","text":"طلب العفو عند الخطأ"},{"id":"o2","text":"وجوب الصدقة وحدها"},{"id":"o1","text":"وجوب الإيمان بجميع الرسل دون تفريق"}],"correct_id":"o1","explanation":"تقرر الآية (285) عدم التفريق بين الرسل في وجوب الإيمان بهم جميعًا.","page":10},{"id":"u01_l01_q136","lesson_id":"u01_l01","difficulty":"medium","prompt":"ما الموقف الذي يجعل قول المؤمن «سمعنا وأطعنا» أصدق تعبيرًا عن إيمانه؟","options":[{"id":"o4","text":"ترك العمل بحجة الاستغفار"},{"id":"o3","text":"الاكتفاء بإعلان الإيمان دون عمل"},{"id":"o1","text":"العمل بالأمر المشروع مع الرضا والتسليم"},{"id":"o2","text":"تأجيل العمل حتى تزول كل مشقة"}],"correct_id":"o1","explanation":"يبين الدرس أن الإيمان إقرار وخضوع يتبعه العمل والامتثال.","page":10},{"id":"u01_l01_q137","lesson_id":"u01_l01","difficulty":"hard","prompt":"أخطأ إنسان ثم أسرع إلى الاستغفار بدل الإصرار على الذنب؛ فأي معنى في شرح الآية (285) يطبّقه؟","options":[{"id":"o1","text":"المبادرة إلى طلب المغفرة عند التقصير"},{"id":"o2","text":"إسقاط المسؤولية عن الأفعال المقصودة"},{"id":"o3","text":"إنكار الحساب في الآخرة"},{"id":"o4","text":"اشتراط العصمة لقبول العمل"}],"correct_id":"o1","explanation":"يقرر الدرس أن الإنسان معرض للخطأ وعليه المسارعة إلى طلب المغفرة.","page":10},{"id":"u01_l01_q141","lesson_id":"u01_l01","difficulty":"medium","prompt":"إذا تردّد إنسان في الإقدام على معصية لا يراه فيها أحد ثم امتنع عنها، فأي حقيقة من شرح الآية (284) استحضرها؟","options":[{"id":"o4","text":"عدم مسؤولية المرء عن اختياره"},{"id":"o2","text":"اقتصار الحساب على الأقوال العلنية"},{"id":"o1","text":"علم الله بالسرائر والنوايا"},{"id":"o3","text":"اختصاص الثواب بالعبادات الظاهرة"}],"correct_id":"o1","explanation":"يوضّح الدرس شمول علم الله تعالى لما يُظهره الإنسان وما يُخفيه، وأثر ذلك في ضبط سلوكه.","page":8},{"id":"u01_l01_q144","lesson_id":"u01_l01","difficulty":"medium","prompt":"ما دلالة اقتران إيمان المؤمنين بإيمان الرسول في شرح الآية (285)؟","options":[{"id":"o2","text":"اعتبار المؤمنين أنبياء"},{"id":"o4","text":"اختصاص الإيمان بزمن نزول الآية"},{"id":"o1","text":"تكريم المؤمنين والثناء عليهم"},{"id":"o3","text":"إسقاط واجب الطاعة عنهم"}],"correct_id":"o1","explanation":"نص الدرس على أن ذكر إيمان المؤمنين مع إيمان الرسول ﷺ زيادة في تكريمهم.","page":9},{"id":"u01_l01_q145","lesson_id":"u01_l01","difficulty":"medium","prompt":"إذا اعترف شخص 1_l01_q172","lesson_id":"u01_l01","difficulty":"medium","prompt":"من يتجنب المعصية في خلوته استحضارًا لعلم الله؛ أي صلة بين الاعتقاد والعمل يوضحها هذا الموقف؟","options":[{"id":"o1","text":"الإيمان بإحاطة العلم الإلهي يوجّه السلوك في السر والعلن"},{"id":"o3","text":"ترك المحاسبة على الأقوال الباطنة يعني إباحة الأعمال المحرمة"},{"id":"o2","text":"معرفة الناس بالعمل هي أساس صلاح النية"},{"id":"o4","text":"سعة الملك تمنع الإنسان من الاختيار"}],"correct_id":"o1","explanation":"ربط شرح الآية بين شمول علم الله للنوايا والأفعال وبين ضبط المسلم لتصرفاته.","page":8},{"id":"u01_l01_q174","lesson_id":"u01_l01","difficulty":"medium","prompt":"لماذا قرن شرح الآيات صدق الإيمان بالعمل بعد الإقرار والتصديق؟","options":[{"id":"o4","text":"لأن الخطأ يمنع طلب المغفرة مطلقًا"},{"id":"o1","text":"لأن الطاعة والامتثال دليلان على حقيقة الإيمان"},{"id":"o3","text":"لأن الإيمان يقتصر على معرفة المعلومات"},{"id":"o2","text":"لأن العمل يغني عن الاعتقاد بأركان الإيمان"}],"correct_id":"o1","explanation":"بيّن الدرس أن الإيمان تصديق وإقرار وخضوع يتبعه عمل يدل على صدقه.","page":10},{"id":"u01_l01_q176","lesson_id":"u01_l01","difficulty":"medium","prompt":"أي موقف يعبّر عن مبدأ تحمل الإنسان تبعة ما كسبه في الآية (286)؟","options":[{"id":"o2","text":"يُحاسَب كل فرد على أخطاء أفراد أسرته"},{"id":"o3","text":"تنتهي مسؤولية الشخص إذا لم يره الناس"},{"id":"o4","text":"لا أثر للعمل الصالح في حساب العبد"},{"id":"o1","text":"يعترف المرء بخطئه ويعمل على إصلاحه بدل إلقاء اللوم على غيره"}],"correct_id":"o1","explanation":"تقرر الآية مسؤولية الإنسان عن عمله وما كسبه من خير أو شر.","page":10},{"id":"u01_l01_q178","lesson_id":"u01_l01","difficulty":"easy","prompt":"أي موقف ظهر من الصحابة بعد توجيه النبي ﷺ في رواية سبب نزول خواتيم البقرة؟","options":[{"id":"o2","text":"الإصرار على رفض التكليف كله"},{"id":"o4","text":"الاعتراض على أركان الإيمان"},{"id":"o3","text":"التوقف عن تعلم القرآن الكريم"},{"id":"o1","text":"الإقرار بالسمع والطاعة والاستغفار"}],"correct_id":"o1","explanation":"أورد الدرس أن الصحابة قالوا سمعنا وأطعنا وغفرانك ربنا وإليك المصير.","page":12},{"id":"u01_l01_q182","lesson_id":"u01_l01","difficulty":"medium","prompt":"من رجع عن معصية ولم يجعل سعة رحمة الله ذريعة للإصرار عليها؛ أي فهم ينسجم مع شرح الآية 284؟","options":[{"id":"o1","text":"يجمع بين رجاء مغفرة الله والامتناع عن المعصية"},{"id":"o2","text":"يجزم بأن التوبة لا تنفع بعد الذنب"},{"id":"o4","text":"يظن أن القدرة الإلهية لا تتعلق بالأفعال"},{"id":"o3","text":"يعد كل خاطر عابر ذنبًا يعاقب عليه"}],"correct_id":"o1","explanation":"أشار الدرس إلى المغفرة لمن تاب وإلى التوازن بين الخوف والرجاء.","page":8},{"id":"u01_l01_q183","lesson_id":"u01_l01","difficulty":"medium","prompt":"طالب يؤمن بالرسل لكنه يرفض أصل الإيمان بالكتب التي أنزلها الله؛ ما وجه الخلل وفق حقائق الآية 285؟","options":[{"id":"o4","text":"اقتصر الخلل على ترك سنّة مستحبة"},{"id":"o2","text":"أتى بكل أركان الإيمان المذكورة"},{"id":"o3","text":"حقق معنى الإقرار والطاعة كاملًا"},{"id":"o1","text":"فصل بين ركنين من أركان الإيمان الواجب التصديق بهما"}],"correct_id":"o1","explanation":"تورد الآية والشرح وجوب الإيمان بالرسل والكتب ضمن حقائق الإيمان.","page":9},{"id":"u01_l01_q185","lesson_id":"u01_l01","difficulty":"medium","prompt":"كيف تجمع الآية 285 بين وحدة مصدر الرسالات وموقف المؤمن من الرسل؟","options":[{"id":"o3","text":"تعتبر الرسالات متعارضة في أصل التوحيد"},{"id":"o1","text":"تلزمه الإيمان بهم جميعًا من غير تفريق"},{"id":"o4","text":"تحصر طاعة الله في أقوال الناس"},{"id":"o2","text":"تجيز له إنكار رسالة أحدهم لقدم عهده"}],"correct_id":"o1","explanation":"شرح الدرس عدم التفريق بين الرسل وأن رسالة سيدنا محمد ﷺ امتداد وخاتمة للرسالات.","page":10},{"id":"u01_l01_q186","lesson_id":"u01_l01","difficulty":"medium","prompt":"ما الفارق بين طلب رفع الإصر وطلب عدم تحميل ما لا طاقة به في دعاء الآية 286؟","options":[{"id":"o4","text":"لا فرق بينهما لأنهما دعاء بالرزق فقط"},{"id":"o2","text":"الأول طلب النصر والثاني طلب المغفرة"},{"id":"o1","text":"الأول رفع التكليف الشاق والثاني دفع ما يتجاوز القدرة"},{"id":"o3","text":"الأول الإيمان بالملائكة والثاني الإيمان بالكتب"}],"correct_id":"o1","explanation":"فسر الدرس الإصر بالتكاليف الثقيلة وبيّن الدعاء بعدم حمل ما لا قدرة عليه.","page":11},{"id":"u01_l02_q106","lesson_id":"u01_l02","difficulty":"medium","prompt":"ما الوظيفة التي تؤديها الدلائل النقلية إذا ضعفت الفطرة أو ضل العقل؟","options":[{"id":"o2","text":"إلغاء الحاجة إلى العبادة"},{"id":"o1","text":"إرشاد الناس إلى العقيدة الصحيحة بواسطة الرسل"},{"id":"o3","text":"إثبات أن الوحي من صنع البشر"},{"id":"o4","text":"حصر الهداية في مراقبة الكواكب"}],"correct_id":"o1","explanation":"يذكر الدرس حاجة الناس إلى رسل يبلغون العقيدة الصحيحة.","page":17},{"id":"u01_l02_q108","lesson_id":"u01_l02","difficulty":"medium","prompt":"ما وجه الخلل في تشبيه نشأة الكون بسقوط حروف تتكون منها قصيدة كاملة بالمصادفة؟","options":[{"id":"o4","text":"القول إن الكون لا يحتوي مخلوقات"},{"id":"o1","text":"تجاهل ما يتطلبه النظام المحكم من ترتيب وإتقان"},{"id":"o2","text":"إثبات أن كل الحروف متماثلة"},{"id":"o3","text":"جعل اللغة مصدر التشريع الثاني"}],"correct_id":"o1","explanation":"المثال في الإثراء ينتقد إرجاع النظام المحكم إلى المصادفة المحضة.","page":18},{"id":"u01_l02_q113","lesson_id":"u01_l02","difficulty":"medium","prompt":"لماذا لا يَقبل دليل السببية أن تكون المخلوقات قد أوجدت نفسها؟","options":[{"id":"o3","text":"لأن الإنسان يستطيع خلق كل ما يحيط به"},{"id":"o4","text":"لأن السبب يأتي دائمًا بعد النتيجة"},{"id":"o2","text":"لأن جميع الموجودات متساوية في الحجم"},{"id":"o1","text":"لأن الشيء كان معدومًا قبل وجوده فلا يخلق نفسه"}],"correct_id":"o1","explanation":"يبين الدرس أن الموجود لم يكن موجودًا قبل أن يوجد فلا يعقل أن يخلق نفسه بنفسه.","page":15},{"id":"u01_l02_q120","lesson_id":"u01_l02","difficulty":"hard","prompt":"إذا لم يستطع باحث الاستدلال من سلوك النمل على الهداية، فأي دليل من سلوك المخلوقات يصلح للمقارنة؟","options":[{"id":"o2","text":"اختيار الورثة أنصبتهم بأنفسهم"},{"id":"o1","text":"اهتداء المولود إلى الرضاعة منذ ولادته"},{"id":"o3","text":"وضع الأنظمة للمؤسسات"},{"id":"o4","text":"تحديد مواعيد السفر"}],"correct_id":"o1","explanation":"ساق الكتاب هداية المولود إلى الرضاعة وهداية النملة إلى غذائها مثالين من النوع نفسه.","page":17},{"id":"u01_l02_q133","lesson_id":"u01_l02","difficulty":"medium","prompt":"مزارع يرى تباين ثمار نباتات تُسقى بماء واحد؛ فأي دلالة يُستثمر هذا المشهد لإيضاحها؟","options":[{"id":"o2","text":"حصر الهداية بالإنسان"},{"id":"o4","text":"انعدام الترابط بين المخلوقات"},{"id":"o1","text":"الإتقان والتنوع في الخلق"},{"id":"o3","text":"توقف الكون عن الحركة"}],"correct_id":"o1","explanation":"استشهد الدرس باختلاف الثمار رغم وحدة الأرض والماء ضمن مظاهر الإتقان.","page":16},{"id":"u01_l02_q142","lesson_id":"u01_l02","difficulty":"hard","prompt":"إذا استُعمل مثال إنسان يطلب النجدة من خالقه حين انقطاع أسباب النجاة، فما الجانب الذي يجعله دليلًا فطريًا لا نقليًا؟","options":[{"id":"o3","text":"تعلقه بإحصاء أسانيد الأحاديث"},{"id":"o1","text":"صدور الشعور من أعماق النفس قبل الاستدلال بنص"},{"id":"o2","text":"اعتماده على قياس أطوال الأجرام"},{"id":"o4","text":"ارتباطه بقوانين الوراثة"}],"correct_id":"o1","explanation":"الدرس يصف الفطرة بأنها اطمئنان مودع في القلب يظهر في أوقات الشدة.","page":15},{"id":"u01_l02_q145","lesson_id":"u01_l02","difficulty":"medium","prompt":"أي استنتاج ينسجم مع ذكر دوران الأرض حول الشمس ودورانها حول نفسها في دليل الإتقان؟","options":[{"id":"o2","text":"كل الحركات تقع بلا انتظام"},{"id":"o4","text":"تعاقب الليل والنهار ظاهرة عشوائية"},{"id":"o1","text":"لكل حركة نظام تتصل به ظواهر محددة"},{"id":"o3","text":"الفصول لا تتصل بحركة الأرض"}],"correct_id":"o1","explanation":"أورد الدرس الحركتين وما يتبعهما من اختلاف الفصول وتعاقب الليل والنهار.","page":16},{"id":"u01_l02_q151","lesson_id":"u01_l02","difficulty":"medium","prompt":"إذا شعر الإنسان بحاجته إلى خالقه في شدة لا يجد فيها عونًا، فأي عنصر من الدليل الفطري يبرز؟","options":[{"id":"o3","text":"أن اليقين لا يتأثر بالتجارب مطلقًا"},{"id":"o4","text":"أن الحاجة إلى العون تنفي وجود الخالق"},{"id":"o1","text":"وجود شعور أصيل باللجوء إلى الله عند الشدائد"},{"id":"o2","text":"قدرة الإنسان على خلق ذاته وقت الأزمات"}],"correct_id":"o1","explanation":"فسّر الكتاب دليل الفطرة بما أودع الله في الإنسان من شعور بوجود خالق يلجأ إليه.","page":15},{"id":"u01_l02_q153","lesson_id":"u01_l02","difficulty":"medium","prompt":"كيف يختلف الاستدلال بتناسق أجزاء العين عن الاستدلال بمجرد وجودها؟","options":[{"id":"o1","text":"إنه ينظر في إحكام وظائف الأجزاء وترابطها"},{"id":"o3","text":"إنه يقتصر على وصف حجم العين"},{"id":"o4","text":"إنه يحصر الإتقان في الأشياء المصنوعة فقط"},{"id":"o2","text":"إنه يعدّ العين غير محتاجة إلى أي نظام"}],"correct_id":"o1","explanation":"يعرض الدرس العين مثالًا على إحكام الخلق وتكامل أجزائه في دليل الإتقان.","page":16},{"id":"u01_l02_q155","lesson_id":"u01_l02","difficulty":"medium","prompt":"لماذا تعد قدرة الرضيع على الرضاعة من الأم مثالًا على الهداية؟","options":[{"id":"o4","text":"لأن جميع المخلوقات تستغني عن الغذاء"},{"id":"o1","text":"لأن المخلوق يهتدي إلى ما يصلح معاشه منذ بدايات حياته"},{"id":"o2","text":"لأن الرضيع يكتسب مهاراته من كتب التاريخ"},{"id":"o3","text":"لأن الاهتداء محصور في الإنسان البالغ"}],"correct_id":"o1","explanation":"أورد الدرس اهتداء المولود إلى الرضاعة دليلًا على هداية الله للمخلوقات.","page":17},{"id":"u01_l02_q172","lesson_id":"u01_l02","difficulty":"medium","prompt":"إذا سأل طالب: لماذا لا يكون الكون قد أوجد نفسه؟ فأي إجابة تنتمي إلى دليل السببية؟","options":[{"id":"o2","text":"حركة النملة في طلب طعامها دليل على الهداية فقط"},{"id":"o1","text":"المعدوم قبل وجوده لا يستطيع إيجاد نفسه"},{"id":"o4","text":"الفطرة تمنع الإنسان من طرح أي سؤال"},{"id":"o3","text":"تنوع الألوان في الثمار شاهد على حسن الخلق"}],"correct_id":"o1","explanation":"شرح الكتاب أن الشيء كان عدمًا قبل وجوده فلا يمكن أن يكون سبب إيجاد نفسه.","page":15},{"id":"u01_l02_q174","lesson_id":"u01_l02","difficulty":"medium","prompt":"على ماذا يستدل اختلاف ثمار النباتات في الطعم واللون والرائحة مع اشتراكها في الأرض والماء؟","options":[{"id":"o3","text":"أن تنوع المخلوقات دليل على الفوضى"},{"id":"o4","text":"أن التماثل التام شرط وجود الخالق"},{"id":"o2","text":"أن النبات الواحد لا يحتاج إلى الماء"},{"id":"o1","text":"دقة الخلق وتنوعه على نحو يدل على الإتقان"}],"correct_id":"o1","explanation":"عرض الدرس تنوع الثمار رغم وحدة أسباب النمو في أمثلة إتقان الخلق.","page":16},{"id":"u01_l02_q177","lesson_id":"u01_l02","difficulty":"easy","prompt":"ما المصدر الذي ترتكز إليه الدلائل النقلية على وجود الله تعالى؟","options":[{"id":"o1","text":"الوحي المنقول عن الأنبياء والرسل"},{"id":"o2","text":"المصادفة وحدها"},{"id":"o4","text":"ملاحظة النبات فقط دون غيره"},{"id":"o3","text":"الاجتهاد في مسائل الطب دون نص"}],"correct_id":"o1","explanation":"عرّف الكتاب الدلائل النقلية بأنها ما نقله الأنبياء والرسل من الوحي لتعريف الناس بربهم.","page":17},{"id":"u01_l02_q183","lesson_id":"u01_l02","difficulty":"medium","prompt":"طالب يذكر دقة عمل العين لا جمال صورتها فقط؛ إلى أي ناحية من حجة الإتقان يشير؟","options":[{"id":"o4","text":"أن المخلوقات لا تتفاوت في الخصائص"},{"id":"o1","text":"إحكام بناء العضو ووظيفته الدقيقة"},{"id":"o2","text":"أن أعضاء الجسم تعمل من دون ترابط"},{"id":"o3","text":"أن الإنسان يختار تركيب أعضائه قبل مولده"}],"correct_id":"o1","explanation":"يستشهد الدرس بدقة أجزاء العين ووظيفتها في إبراز الإتقان.","page":16},{"id":"u01_l02_q184","lesson_id":"u01_l02","difficulty":"hard","prompt":"ما الاستنتاج الذي يجمع بين انتظام حركة الأجرام وتناسق جسم الإنسان في عرض أدلة الوجود؟","options":[{"id":"o4","text":"أن التفكير في الكون يناقض الفطرة"},{"id":"o3","text":"أن مظهرًا واحدًا ينفي الحاجة إلى الاستدلال"},{"id":"o2","text":"أن كل الظواهر لا تخضع لأي نظام"},{"id":"o1","text":"تعدد المشاهد الكونية التي تشهد على دقة الصنع"}],"correct_id":"o1","explanation":"يدرج الشرح هذه المشاهد تحت انتظام الكون وإتقان الخلق.","page":16},{"id":"u01_l02_q185","lesson_id":"u01_l02","difficulty":"medium","prompt":"ما وجه الاستدلال بهداية المخلوقات إلى وسائل بقائها على العناية الإلهية؟","options":[{"id":"o4","text":"نشوء نظام الحياة من اختيار البشر وحدهم"},{"id":"o2","text":"استغناء كل مخلوق عن الطعام والبيئة"},{"id":"o1","text":"تيسير سبل المعيشة والانتفاع {"id":"u01_l04_q162","lesson_id":"u01_l04","difficulty":"hard","prompt":"إذا كان النصح سيؤدي إلى فساد أكبر من الخطأ الأصلي، فما الضابط الذي ينبغي مراعاته؟","options":[{"id":"o3","text":"أن يهمل تقدير النتائج على الآخرين"},{"id":"o1","text":"ألا يترتب على التغيير منكر أشد من المنكر المراد تغييره"},{"id":"o2","text":"أن يغيّر المرء كل خطأ بالقوة بنفسه"},{"id":"o4","text":"أن ينشر أخطاء المخالفين أولًا"}],"correct_id":"o1","explanation":"تضمن الدرس مراعاة المصلحة وتجنب ترتب منكر أعظم عند الإنكار.","page":29},{"id":"u01_l04_q163","lesson_id":"u01_l04","difficulty":"medium","prompt":"نصح طالب زميله بلغة مهذبة مستندًا إلى علم بحكم الفعل؛ أي ميزتين اجتمعتا في تصرفه؟","options":[{"id":"o3","text":"الاستعلاء وإساءة الظن"},{"id":"o1","text":"العلم والحكمة في أسلوب النصيحة"},{"id":"o4","text":"إكراه الناس دون صلاحية"},{"id":"o2","text":"التجسس والتشهير"}],"correct_id":"o1","explanation":"جعل الكتاب العلم والحكمة من أهم آداب الأمر بالمعروف والنهي عن المنكر.","page":30},{"id":"u01_l04_q167","lesson_id":"u01_l04","difficulty":"medium","prompt":"من الجهة التي قد تملك صلاحية التغيير باليد في مجال سلامة الغذاء؟","options":[{"id":"o4","text":"الطلاب خارج المدرسة وحدهم"},{"id":"o1","text":"المؤسسات الرقابية الرسمية المختصة"},{"id":"o3","text":"أي حساب مجهول على الإنترنت"},{"id":"o2","text":"كل مستهلك دون قيد قانوني"}],"correct_id":"o1","explanation":"ذكر الكتاب مؤسسة الغذاء والدواء ضمن الجهات التي تملك سلطة التغيير باليد بضوابط.","page":32},{"id":"u01_l04_q172","lesson_id":"u01_l04","difficulty":"medium","prompt":"ما معنى كون الأمر بالمعروف والنهي عن المنكر فرض كفاية؟","options":[{"id":"o2","text":"أن أداءه ممنوع على غير المعلمين"},{"id":"o3","text":"أنه يسقط عن المجتمع حتى لو لم يقم به أحد"},{"id":"o4","text":"أنه لا يتطلب علمًا ولا قدرة"},{"id":"o1","text":"إذا قام به من يكفي تحققت الكفاية وسقط الإثم عن الباقين"}],"correct_id":"o1","explanation":"نص الدرس على أنه فرض كفاية يقوم به من يكفي بحسب العلم والقدرة.","page":29},{"id":"u01_l04_q174","lesson_id":"u01_l04","difficulty":"medium","prompt":"لماذا شبّه الحديث أفراد المجتمع بركّاب سفينة عند الحديث عن المنكر؟","options":[{"id":"o2","text":"لأن لكل فرد الحق في الإضرار بالآخرين"},{"id":"o4","text":"لأن النصيحة تقتصر على شؤون السفر"},{"id":"o3","text":"لأن سلامة المجتمع لا علاقة لها بسلوك أفراده"},{"id":"o1","text":"لأن إهمال فساد بعضهم قد يضر بالمجتمع كله"}],"correct_id":"o1","explanation":"يؤكد مثل السفينة أن منع الضرر يحمي الجميع من عواقب المنكر.","page":30},{"id":"u01_l04_q176","lesson_id":"u01_l04","difficulty":"medium","prompt":"ماذا نستنتج من قصة الحسن والحسين في تصحيح الوضوء لرجل كبير؟","options":[{"id":"o3","text":"أن تصحيح العبادة لا يحتاج إلى مثال عملي"},{"id":"o1","text":"أن النصيحة غير المباشرة قد تحفظ كرامة المخطئ وتحقق التعلم"},{"id":"o2","text":"أن كشف الخطأ أمام الناس هو الطريقة الوحيدة للتعليم"},{"id":"o4","text":"أن المشورة لا تفيد في تصحيح السلوك"}],"correct_id":"o1","explanation":"تدل القصة على فاعلية الحكمة واللطف في تصحيح خطأ الوضوء.","page":31},{"id":"u01_l04_q181","lesson_id":"u01_l04","difficulty":"medium","prompt":"في مؤسسة سكت الجميع عن غش ظاهر مع قدرتهم على معالجته؛ ما الخلل في أداء فرض الكفاية؟","options":[{"id":"o2","text":"تحقق الكفاية بمجرد معرفة وقوع الغش"},{"id":"o3","text":"تحول السكوت إلى إقرار بفضيلة الغش"},{"id":"o1","text":"عدم قيام من يكفي بإزالة المنكر وفق الضوابط"},{"id":"o4","text":"انتهاء واجب النصيحة عند انتشار الخطأ"}],"correct_id":"o1","explanation":"تقتضي الكفاية أن يقوم بالأمر من يحقق الغرض مع العلم والقدرة.","page":29},{"id":"u01_l04_q183","lesson_id":"u01_l04","difficulty":"medium","prompt":"ما أثر إهمال أفراد السفينة محاولة أحدهم إحداث خرق فيها بحسب المثل النبوي؟","options":[{"id":"o4","text":"ازدياد سلامة السفينة بسبب الخرق"},{"id":"o3","text":"انتفاء مسؤولية بقية الركاب ولو استطاعوا المنع"},{"id":"o1","text":"امتداد الضرر إلى الركاب جميعًا"},{"id":"o2","text":"بقاء الضرر محصورًا في صاحب الخرق دائمًا"}],"correct_id":"o1","explanation":"مثل السفينة يوضح أن ترك المنكر يهدد السلامة العامة.","page":30},{"id":"u01_l04_q184","lesson_id":"u01_l04","difficulty":"hard","prompt":"طالب ينصح زميله سرًا ويذكر له أثر الخطأ على حقوق غيره؛ لماذا يعد هذا أقرب إلى الحكمة؟","options":[{"id":"o3","text":"لأن كل نصيحة يجب أن تكون عامة أمام الناس"},{"id":"o2","text":"لأنه يمنع الزميل من فهم خطئه"},{"id":"o1","text":"لأنه يجمع اللطف مع بيان المصلحة والضرر"},{"id":"o4","text":"لأن الحفاظ على الكرامة يلغي تصحيح الخطأ"}],"correct_id":"o1","explanation":"يؤكد الدرس الموعظة الحسنة والرفق والابتعاد عن التشهير.","page":30},{"id":"u01_l04_q185","lesson_id":"u01_l04","difficulty":"medium","prompt":"بماذا يستدل من مطالبة الناصح بأن يبدأ بإصلاح نفسه قبل مطالبة غيره؟","options":[{"id":"o1","text":"وجوب موافقة العمل لما يدعو إليه المرء"},{"id":"o3","text":"أن كلام الناصح يغني عن كل سلوك"},{"id":"o4","text":"أن القدوة لا تؤثر في قبول التوجيه"},{"id":"o2","text":"أن العاقل لا ينصح أحدًا مطلقًا"}],"correct_id":"o1","explanation":"جعل الكتاب العمل بما يأمر به المرء من آداب النصيحة.","page":31},{"id":"u01_l04_q187","lesson_id":"u01_l04","difficulty":"medium","prompt":"إذا لم يستطع المرء تغيير منكر بيده ولا بلسانه، فأي موقف يوافق مراتب التغيير؟","options":[{"id":"o1","text":"إنكاره بقلبه مع عدم الرضا عنه"},{"id":"o4","text":"إهمال الحكم لأن يده عاجزة"},{"id":"o3","text":"تعريض نفسه والناس لضرر أكبر"},{"id":"o2","text":"إعلان الرضا بالمنكر حتى لا يختلف مع الناس"}],"correct_id":"o1","explanation":"ذكر الحديث مرتبة القلب عند عدم القدرة على التغيير باليد أو اللسان.","page":32},{"id":"u01_l05_q094","lesson_id":"u01_l05","difficulty":"medium","prompt":"أي وصف أدق للحشر؟","options":[{"id":"o3","text":"زمن يسبق الحياة الدنيا"},{"id":"o1","text":"جمع المخلوقات بعد بعثها في مكان واحد"},{"id":"o4","text":"اسم لفصل من فصول السنة"},{"id":"o2","text":"تفرق الناس دون اجتماع"}],"correct_id":"o1","explanation":"الحشر هو جمع الخلق بعد بعثهم في أرض المحشر.","page":36},{"id":"u01_l05_q108","lesson_id":"u01_l05","difficulty":"medium","prompt":"ما أثر استحضار جزاء الآخرة عند إغراء الإنسان بكسب غير مشروع؟","options":[{"id":"o3","text":"تجاهل حقوق الآخرين"},{"id":"o4","text":"إلغاء التوبة من حياته"},{"id":"o2","text":"تقديم اللذة المؤقتة على المبدأ"},{"id":"o1","text":"ترك الوسيلة المحرمة وإن بدت مغرية"}],"correct_id":"o1","explanation":"يعد الدرس الابتعاد عن تحصيل الملذات بطرق غير مشروعة من آثار الإيمان بالآخرة.","page":38},{"id":"u01_l05_q121","lesson_id":"u01_l05","difficulty":"medium","prompt":"ما الأثر العملي الذي ينسجم مع الإيمان باليوم الآخر عند اتخاذ قرار أخلاقي؟","options":[{"id":"o3","text":"إنكار مسؤولية المرء عن أفعاله"},{"id":"o4","text":"حصر الاهتمام بالسمعة الاجتماعية"},{"id":"o2","text":"تقديم النفع العاجل ولو كان محرمًا"},{"id":"o1","text":"مراعاة الحساب والجزاء ولو غاب رقيب الناس"}],"correct_id":"o1","explanation":"يربط الدرس اليقين بالجزاء بتحسين سلوك الإنسان.","page":34},{"id":"u01_l05_q124","lesson_id":"u01_l05","difficulty":"hard","prompt":"طالب يخلط بين مرحلة البرزخ وحدث الحشر؛ ما التصحيح؟","options":[{"id":"o2","text":"البرزخ اسم لميزان الأعمال"},{"id":"o3","text":"الحشر مرحلة تسبق الموت الدنيوي"},{"id":"o4","text":"كلتا المرحلتين تعني تسلم الصحف"},{"id":"o1","text":"البرزخ يبدأ بعد الموت إلى البعث، والحشر جمع الناس بعد بعثهم"}],"correct_id":"o1","explanation":"عرّف الكتاب البرزخ بأنه بين الموت والبعث والحشر بأنه جمع الناس يوم القيامة.","page":35},{"id":"u01_l05_q133","lesson_id":"u01_l05","difficulty":"medium","prompt":"أي حدث يسبق خروج الناس من القبور بعد انتهاء الحياة الدنيا بحسب العرض؟","options":[{"id":"o4","text":"دخول الجنة"},{"id":"o3","text":"الشفاعة الصغرى"},{"id":"o1","text":"النفخ في الصور الذي تقع به الوفاة"},{"id":"o2","text":"عرض صحائف الأعمال"}],"correct_id":"o1","explanation":"يسرد الكتاب النفخ في الصور ضمن بداية أحداث يوم القيامة قبل البعث.","page":36},{"id":"u01_l05_q135","lesson_id":"u01_l05","difficulty":"medium","prompt":"عند طول انتظار الناس في المحشر، إلى مَن تنتهي طلبات الشفاعة لبدء الحساب؟","options":[{"id":"o1","text":"إلى النبي محمد ﷺ"},{"id":"o2","text":"إلى أصحاب المال"},{"id":"o4","text":"إلى العلماء في الدنيا"},{"id":"o3","text":"إلى الملائكة وحدهم"}],"correct_id":"o1","explanation":"ذكر الدرس شفاعة النبي ﷺ الكبرى لبدء الحساب.","page":37},{"id":"u01_l05_q138","lesson_id":"u01_l05","difficulty":"medium","prompt":"عندما تردع فكرة الحساب شخصًا عن كسب محرم سريع، أي أثر للإيمان بالآخرة يتجلى؟","options":[{"id":"o4","text":"إلغاء مسؤولية الشخص عن اختياره"},{"id":"o2","text":"اشتراط ترك الكسب كله"},{"id":"o1","text":"تقديم الثواب الأخروي على لذة محرمة"},{"id":"o3","text":"ضمان الثراء لكل مؤمن"}],"correct_id":"o1","explanation":"من آثار الإيمان بالآخرة تجنب الملذات غير المشروعة.","page":38},{"id":"u01_l05_q141","lesson_id":"u01_l05","difficulty":"medium","prompt":"لماذا لا تؤدي مشاهدة علامات يوم القيامة إلى معرفة موعدها يقينًا؟","options":[{"id":"o3","text":"لأن العلامات أحكام المواريث"},{"id":"o4","text":"لأن كل إنسان يحدد موعدها لنفسه"},{"id":"o1","text":"لأن توقيت الساعة من الغيب الذي اختص الله بعلمه"},{"id":"o2","text":"لأن العلامات وقعت كلها في عصر واحد"}],"correct_id":"o1","explanation":"يفرق الدرس بين العلامات الدالة على قرب الساعة وبين العلم بوقتها.","page":35},{"id":"u01_l05_q143","lesson_id":"u01_l05","difficulty":"medium","prompt":"ما الحدث الذي تنتهي به حياة الأحياء عند النفخة الأولى في الصور؟","options":[{"id":"o4","text":"العودة إلى الحياة الدنيا"},{"id":"o1","text":"الموت والهلاك بأمر الله"},{"id":"o2","text":"توزيع صحائف الأعمال"},{"id":"o3","text":"الدخول إلى الجنة"}],"correct_id":"o1","explanation":"تميّز صفحات الدرس النفخة الأولى وما يتبعها عن النفخة الثانية المرتبطة بالبعث.","page":36},{"id":"u01_l05_q144","lesson_id":"u01_l05","difficulty":"hard","prompt":"إذا وصف أحدهم الحشر بأنه إحياء الأموات من القبور فقط، فما الجزء الذي أغفله من تعريفه؟","options":[{"id":"o1","text":"جمع المبعوثين في أرض المحشر"},{"id":"o2","text":"الحياة في البرزخ"},{"id":"o3","text":"زمن ظهور علامات الساعة"},{"id":"o4","text":"النظر في أعمال الدنيا قبل الموت"}],"correct_id":"o1","explanation":"يفرق الكتاب بين البعث من القبور والحشر بجمع الخلق في موضع واحد.","page":36},{"id":"u01_l05_q147","lesson_id":"u01_l05","difficulty":"medium","prompt":"مؤمن يحرص على أداء حقوق الناس وهو يتذكر يوم الحساب؛ ما الأثر الذي يفسّر هذا الحرص؟","options":[{"id":"o3","text":"الركون إلى المال وحده"},{"id":"o4","text":"إهمال مسؤوليات المجتمع"},{"id":"o2","text":"الاستغناء عن العمل النافع"},{"id":"o1","text":"مراقبة العمل والاستعداد للجزاء"}],"correct_id":"o1","explanation":"من آثار الإيمان بالآخرة استقامة السلوك والمداومة على الصالحات.","page":38},{"id":"u01_l05_q148","lesson_id":"u01_l05","difficulty":"hard","prompt":"ما السبب المعرفي الذي يمنع وضع تفاصيل جازمة عن البرزخ بالاعتماد على التجربة المباشرة للأحياء؟","options":[{"id":"o4","text":"أن البرزخ يساوي مرحلة الدراسة"},{"id":"o2","text":"أن البرزخ جزء من تاريخ الغزوات"},{"id":"o1","text":"أن البرزخ عالم غيبي لا يُعلم منه إلا ما أخبر به الوحي"},{"id":"o3","text":"أن الشهادة البشرية تغني عن النص في كل غيب"}],"correct_id":"o1","explanation":"نص الدرس على عدم معرفة أحوال البرزخ إلا بما أخبر به الوحي.","page":39},{"id":"u01_l05_q153","lesson_id":"u01_l05","difficulty":"easy","prompt":"ما الذي يربط الإيمان بالله بالإيمان باليوم الآخر في توجيه السلوك؟","options":[{"id":"o2","text":"الاعتماد على المال وحده في تحديد الصواب"},{"id":"o3","text":"ترك العناية بحقوق الناس"},{"id":"o1","text":"استشعار المساءلة عند اختيار القول والفعل"},{"id":"o4","text":"إمكان تحديد موعد الساعة بالتجربة"}],"correct_id":"o1","explanation":"بيّن الدرس أن اقتران الإيمان بالله واليوم الآخر يدعم ضبط سلوك المؤمن.","page":35},{"id":"u01_l05_q154","lesson_id":"u01_l05","difficulty":"medium","prompt":"إذا فسّر أحدهم النفخة الثانية بأنها موت الأحياء، فما وجه الخطأ في ذلك؟","options":[{"id":"o2","text":"لأن النفختين تعنيان جمع الأعمال في الميزان"},{"id":"o1","text":"النفخة الثانية مرتبطة بالبعث بعد نفخة انتهاء الحياة"},{"id":"o3","text":"لأن النفخة الثانية تعني بداية الرسالة النبوية"},{"id":"o4","text":"لأن نفخ الصور من شؤون الدنيا المعتادة"}],"correct_id":"o1","explanation":"فرّق الكتاب بين النفخة الأولى للموت والثانية للبعث.","page":36},{"id":"u01_l05_q156","lesson_id":"u01_l05","difficulty":"hard","prompt":"شخص اختار ردّ مظلمة كان يمكن أن يخفيها عن الناس؛ أي أثر للإيمان بالآخرة يظهر في اختياره؟","options":[{"id":"o2","text":"الاعتقاد أن الحقوق تضيع بعد الموت"},{"id":"o3","text":"الاعتماد على إخفاء الخطأ لإلغاء المسؤولية"},{"id":"o1","text":"استحضار الحساب على الحقوق مهما خفي الفعل عن البشر"},{"id":"o4","text":"القول إن الحساب لا يشمل المعاملة بين الناس"}],"correct_id":"o1","explanation":"يربط الدرس الإيمان بالحساب بالتزام الحقوق والابتعاد عن المعاصي.","page":37},{"id":"u01_l05_q162","lesson_id":"u01_l05","difficulty":"medium","prompt":"ما الغرض من إخبار الناس بعلامات اليوم الآخر دون بيان وقت وقوعه؟","options":[{"id":"o2","text":"تمكينهم من تحديد موعد الساعة بالدقيقة"},{"id":"o1","text":"تنبيههم إلى التوبة والاستعداد بالأعمال الصالحة"},{"id":"o4","text":"حصر الاستعداد في مراقبة الظواهر"},{"id":"o3","text":"صرفهم عن مسؤوليات الحياة"}],"correct_id":"o1","explanation":"بيّن الدرس أن العلامات تدعو إلى اليقظة والتوبة مع بقاء وقت الساعة من الغيب.","page":34},{"id":"u01_l05_q165","lesson_id":"u01_l05","difficulty":"medium","prompt":"ما دلالة إعطاء المؤمن صحيفة عمله بيمينه وفق شرح أحداث القيامة؟","options":[{"id":"o3","text":"أن الحساب لا يشمل الصغائر"},{"id":"o4","text":"أن الناس يتبادلون الصحائف عشوائيًا"},{"id":"o1","text":"ارتباطه بالإيمان والعمل الصالح والبشرى"},{"id":"o2","text":"أن الصحيفة لا تتضمن أعمال الدنيا"}],"correct_id":"o1","explanation":"ذكر الدرس أن أهل الإيمان والعمل الصالح يأخذون كتبهم بأيمانهم.","page":37},{"id":"u01_l05_q174","lesson_id":"u01_l05","difficulty":"medium","prompt":"عندما يُبعث الناس من القبور، أي حدث يسبق جمعهم في المحشر؟","options":[{"id":"o1","text":"النفخة الثانية في الصور"},{"id":"o3","text":"دخول الجنة أو النار"},{"id":"o4","text":"توزيع أنصبة المواريث"},{"id":"o2","text":"الشفاعة الصغرى"}],"correct_id":"o1","explanation":"النفخة الثانية هي نفخة البعث ثم يكون حشر المخلوقات في مكان واحد.","page":36},{"id":"u01_l05_q183","lesson_id":"u01_l05","difficulty":"medium","prompt":"ما وجه اختلاف الحشر عن البعث ضمن ترتيب أحداث اليوم الآخر؟","options":[{"id":"o2 2_l01_q144","lesson_id":"u02_l01","difficulty":"medium","prompt":"ما الخلل في قول إن الأصل تحريم الطعام حتى يرد دليل خاص بإباحة كل صنف؟","options":[{"id":"o3","text":"لأن الإسراف مطلوب في الأطعمة"},{"id":"o2","text":"لأن جميع المطعومات محرمة بإطلاق"},{"id":"o4","text":"لأن حكم الطعام من أحكام الميراث"},{"id":"o1","text":"لأنه يعكس قاعدة الإباحة الأصلية إلا ما دل الدليل على تحريمه"}],"correct_id":"o1","explanation":"وردت قاعدة الأصل في الأشياء الإباحة إلا ما حرمه الشرع، ومنها المطعومات والمشروبات.","page":50},{"id":"u02_l01_q146","lesson_id":"u02_l01","difficulty":"medium","prompt":"إذا وقع فعل محرّم في الخفاء، فلماذا لا يخرج عن نطاق التحريم في شرح الآية (33)؟","options":[{"id":"o2","text":"لأن الحكم يزول باختفاء الناس"},{"id":"o1","text":"لأن التحريم يشمل ما ظهر من الفواحش وما بطن"},{"id":"o3","text":"لأن التحريم مقصور على العلن"},{"id":"o4","text":"لأن ما يقع في الخفاء لا أثر له"}],"correct_id":"o1","explanation":"ذكر الدرس أن الفواحش محرمة ظاهرها وباطنها، وأن الله تعالى يعلمها.","page":51},{"id":"u02_l01_q147","lesson_id":"u02_l01","difficulty":"hard","prompt":"ما الرابط بين منع نسبة حكم إلى الله بغير دليل والنهي عن تحريم زينته التي أخرج لعباده؟","options":[{"id":"o3","text":"إلغاء كل حكم يتعلق بالمباحات"},{"id":"o2","text":"إباحة الكذب إذا رآه الناس مناسبًا"},{"id":"o1","text":"حماية التشريع من ادعاء أحكام لا دليل عليها"},{"id":"o4","text":"ربط التحريم برأي الأكثرية وحده"}],"correct_id":"o1","explanation":"من المحرمات القول على الله بغير علم، كما أنكرت الآيات تحريم ما أباحه دون دليل.","page":52},{"id":"u02_l01_q151","lesson_id":"u02_l01","difficulty":"easy","prompt":"ما المعنى الذي أورده صندوق المفردات للتعبير الدال على مجاوزة الحد في الآية (31)؟","options":[{"id":"o4","text":"التوسع في حق الانتخاب"},{"id":"o1","text":"تجاوز المقدار المعتاد في الانتفاع بالنعم"},{"id":"o3","text":"السفر من مكان إلى آخر"},{"id":"o2","text":"ترك جميع أنواع الطعام المباح"}],"correct_id":"o1","explanation":"شرح صندوق المفردات أن النهي متعلق بمجاوزة الحد المعتاد.","page":49},{"id":"u02_l01_q152","lesson_id":"u02_l01","difficulty":"medium","prompt":"أراد شخص أن يلبس لباسًا جميلًا ساترًا عند الصلاة؛ ما الفهم الصحيح لهذه الرغبة؟","options":[{"id":"o4","text":"الزينة لا تشمل إلا الأموال والمجوهرات"},{"id":"o1","text":"الزينة المباحة من تعظيم شأن العبادة دون إسراف"},{"id":"o3","text":"ستر العورة غير مطلوب في المسجد"},{"id":"o2","text":"اللباس الجميل محرم في كل صلاة"}],"correct_id":"o1","explanation":"شرح الكتاب الزينة بأنها اللباس الساتر الجميل وأشار إلى مكانة بيوت الله.","page":50},{"id":"u02_l01_q155","lesson_id":"u02_l01","difficulty":"medium","prompt":"إقدام مسؤول على خيانة أمانة الناس، في أي وصف من أوصاف المحرمات الذي عرضته الآية يدخل؟","options":[{"id":"o1","text":"البغي والتعدي على حقوق الآخرين"},{"id":"o2","text":"الزينة المشروعة عند المسجد"},{"id":"o4","text":"الاستئذان المشروع قبل الدخول"},{"id":"o3","text":"الانتفاع المعتدل بالطعام"}],"correct_id":"o1","explanation":"عدّ الكتاب خيانة الأمانة من صور البغي والظلم على الآخرين.","page":51},{"id":"u02_l01_q156","lesson_id":"u02_l01","difficulty":"hard","prompt":"لماذا يتضمن وصف الشرك بأنه اتخاذ ند لله جانبًا يتجاوز مجرد الخطأ الأخلاقي بين الناس؟","options":[{"id":"o2","text":"لأنه اختلاف في نوع الطعام فقط"},{"id":"o4","text":"لأنه اختلاف في طريقة السكن"},{"id":"o1","text":"لأنه تعلق بحق الله في العبودية والربوبية"},{"id":"o3","text":"لأنه متعلق بشروط بيع السلع"}],"correct_id":"o1","explanation":"فسّر الدرس الشرك بجعل ند أو شريك لله في العبودية والربوبية.","page":51},{"id":"u02_l01_q161","lesson_id":"u02_l01","difficulty":"medium","prompt":"بماذا يفسر صندوق المفردات في الآيات تعبير اتخاذ الزينة عند المسجد؟","options":[{"id":"o4","text":"ترك ستر العورة بحجة البساطة"},{"id":"o1","text":"ارتداء اللباس الساتر المناسب"},{"id":"o2","text":"الامتناع عن دخول بيوت الله"},{"id":"o3","text":"شراء ثياب مرتفعة الثمن لذاتها"}],"correct_id":"o1","explanation":"بينت مفردات الآيات أن المقصود التزين باللباس الساتر.","page":49},{"id":"u02_l01_q163","lesson_id":"u02_l01","difficulty":"hard","prompt":"ادّعى أحدهم أن كل طعام لم يرد نص بإباحته ممنوع؛ أي قاعدة من شرح الآيات تردّ قوله؟","options":[{"id":"o1","text":"الأصل في المطعومات والمشروبات الإباحة إلا ما ورد بتحريمه دليل"},{"id":"o2","text":"الأصل تحريم جميع الأطعمة حتى يصنعها المرء بنفسه"},{"id":"o3","text":"الإسراف مباح في الطعام المباح"},{"id":"o4","text":"التحريم يكون بالذوق الشخصي لا بالدليل"}],"correct_id":"o1","explanation":"قرر الدرس إباحة المطعومات والمشروبات إلا ما ورد الدليل على تحريمه.","page":50},{"id":"u02_l01_q168","lesson_id":"u02_l01","difficulty":"medium","prompt":"أجاز شخص لنفسه نسبة تحريم إلى الله دون نص؛ في أي محرم يندرج فعله؟","options":[{"id":"o2","text":"الاعتدال في التمتع بالطيبات"},{"id":"o3","text":"تعظيم المسجد باللباس الحسن"},{"id":"o4","text":"التعجيل بالأعمال الصالحة"},{"id":"o1","text":"القول على الله بغير علم"}],"correct_id":"o1","explanation":"صنف الدرس افتراء أحكام على الله من القول عليه بغير علم.","page":52},{"id":"u02_l01_q174","lesson_id":"u02_l01","difficulty":"medium","prompt":"لماذا يُعد الإسراف في استهلاك الماء والطعام مخالفًا لتوجيه الآيات؟","options":[{"id":"o1","text":"لما فيه من ضرر واستنزاف للثروات والمقدرات"},{"id":"o3","text":"لأنه يحافظ على الموارد من النفاد"},{"id":"o4","text":"لأنه يساوي الاقتصاد في النفقات"},{"id":"o2","text":"لأنه دليل على الاهتمام بالآخرين دائمًا"}],"correct_id":"o1","explanation":"علّل الدرس النهي عن الإسراف بالضرر واستنزاف الموارد.","page":50},{"id":"u02_l01_q176","lesson_id":"u02_l01","difficulty":"medium","prompt":"ما الذي يوضحه ردّ القرآن على تقليد الآباء دون دليل في سياق سورة الأعراف؟","options":[{"id":"o1","text":"أن التقليد الأعمى لا يبرر الذنوب ولا يغني عن الحق والدليل"},{"id":"o4","text":"أن الإنسان لا يتحمل مسؤولية خياراته"},{"id":"o2","text":"أن فعل الأسلاف يصبح مباحًا بمجرد شيوعه"},{"id":"o3","text":"أن العادات تكفي وحدها لتحديد الحلال والحرام"}],"correct_id":"o1","explanation":"أوضح الإثراء رفض الاحتجاج بتقليد الآباء والأجداد في ارتكاب المخالفات دون بصيرة.","page":52},{"id":"u02_l01_q178","lesson_id":"u02_l01","difficulty":"easy","prompt":"ما الموقف الذي تنتقده الآيات عند نسبة تحليل أو تحريم إلى الله دون دليل؟","options":[{"id":"o4","text":"احترام حرمة المسجد"},{"id":"o2","text":"الحرص على أداء الصلاة"},{"id":"o3","text":"الاعتدال في الإنفاق"},{"id":"o1","text":"الافتراء على الله تعالى"}],"correct_id":"o1","explanation":"نص الشرح على أن نسبة أحكام إلى الله لم يقل بها من الكذب والافتراء عليه.","page":52},{"id":"u02_l01_q181","lesson_id":"u02_l01","difficulty":"medium","prompt":"ما المقصود بالنهي عن مجاوزة الحد المعتاد في آيات الأعراف عند تناول المباحات؟","options":[{"id":"o2","text":"تحريم كل ما فيه زينة ولو كان مباحًا"},{"id":"o1","text":"تجنب الإسراف مع بقاء أصل إباحة الطيبات"},{"id":"o3","text":"منع الطعام والشراب في الحياة اليومية"},{"id":"o4","text":"حصر الاعتدال في أيام الصيام وحدها"}],"correct_id":"o1","explanation":"فسر الدرس النهي عن الإسراف بعد إباحة الطعام والشراب بأنه عدم تجاوز الحد المعتاد.","page":49},{"id":"u02_l01_q182","lesson_id":"u02_l01","difficulty":"medium","prompt":"لماذا خصت الآية المسجد بذكر الزينة مع عموم الاهتمام باللباس؟","options":[{"id":"o1","text":"تعظيم مكانة بيوت الله والتحفيز على احترامها"},{"id":"o3","text":"لأن الزينة تعني المبالغة في الثمن"},{"id":"o2","text":"لأن ستر العورة لا يلزم خارج المسجد مطلقًا"},{"id":"o4","text":"لأن دخول المسجد يمنع لباسًا ساترًا جميلًا"}],"correct_id":"o1","explanation":"ذكر الكتاب أن تخصيص المسجد يذكّر بعظمة بيوت الله ويحفز على تعظيمها.","page":50},{"id":"u02_l01_q185","lesson_id":"u02_l01","difficulty":"medium","prompt":"لماذا يقترن تحريم الاعتداء على حقوق الآخرين بتحريم الفواحش في شرح الآيات؟","options":[{"id":"o4","text":"لأن الاعتداء لا يتصل بالتكليف الديني"},{"id":"o3","text":"لأن الفواحش مباحة عند رضا المجتمع"},{"id":"o2","text":"لأن الحقوق ليست جزءًا من الأخلاق"},{"id":"o1","text":"لأن توجيه الآيات يشمل صلاح السلوك الشخصي والاجتماعي"}],"correct_id":"o1","explanation":"عرض الدرس مجموعة محرمات تحفظ الأخلاق والحقوق وتمنع العدوان.","page":51},{"id":"u02_l01_q186","lesson_id":"u02_l01","difficulty":"medium","prompt":"ما الذي يدل عليه ذكر أجل الأمم إلى جانب أجل الأفراد في سورة الأعراف؟","options":[{"id":"o4","text":"أن لأجل الأمة صلة بالطعام وحده"},{"id":"o2","text":"أن الأمم لا تمر بالتغير أو الزوال"},{"id":"o1","text":"أن للأفراد والجماعات مددًا مقدرة لا تتقدم ولا تتأخر عن أجلها"},{"id":"o3","text":"أن الإنسان يعرف أجله بمجرد عمره"}],"correct_id":"o1","explanation":"بينت الآية 34 في الدرس أن للأمم آجالًا محددة كما للأفراد.","page":52},{"id":"u02_l01_q188","lesson_id":"u02_l01","difficulty":"medium","prompt":"إذا طُلب تحديد نوع الاستفهام في الإنكار على تحريم زينة الله المباحة، فأي توصيف يناسب السياق؟","options":[{"id":"o4","text":"استفهام يحدد زمن قيام الساعة"},{"id":"o2","text":"استفهام لطلب معرفة العدد فقط"},{"id":"o1","text":"استفهام إنكاري يرد التحريم بغير حق"},{"id":"o3","text":"استفهام يتضمن إباحة الكذب على الله"}],"correct_id":"o1","explanation":"تعرض مراجعة الدرس دلالة الاستفهام المتعلق بزينة الله والطيبات.","page":54},{"id":"u02_l02_q092","lesson_id":"u02_l02","difficulty":"medium","prompt":"لماذا لا تُعد المنفعة المالية المتحصلة من أمر محرم مصلحة معتبرة؟","options":[{"id":"o1","text":"لأن الشرع قد ألغى اعتبار تلك المنفعة"},{"id":"o4","text":"لأن المنفعة الخاصة تغلب كل حكم"},{"id":"o2","text":"لأن كل مال مكتسب محرم"},{"id":"o3","text":"لأن الربح لا يتعلق بالمصالح أصلًا"}],"correct_id":"o1","explanation":"يصنف الدرس المنافع التي رفضها الشرع مصالح ملغاة.","page":56},{"id":"u02_l02_q105","lesson_id":"u02_l02","difficulty":"medium","prompt":"لماذا يعد نظر الخاطب إلى المخطوبة من المصالح المعتبرة؟","options":[{"id":"o3","text":"لأن منفعة شخص واحد تبيح كل شيء"},{"id":"o1","text":"لوجود دليل يراعي الألفة والمودة بينهما"},{"id":"o2","text":"لأنه ممارسة بلا ضابط أو أساس شرعي"},{"id":"o4","text":"لأن الضرر هو المقصد من هذا الحكم"}],"correct_id":"o1","explanation":"ذكر الدرس هذا المثال ضمن المصلحة التي قبلها الشرع.","page":56},{"id":"u02_l02_q107","lesson_id":"u02_l02","difficulty":"medium","prompt":"أي ضابط يُستعمل حين يظن شخص أن نفعه الخاص يبيح الإضرار بعموم الناس؟","options":[{"id":"o2","text":"اعتبار المنفعة الخاصة معيارًا وحيدًا"},{"id":"o4","text":"قبول كل ادعاء بلا فحص"},{"id":"o1","text":"تقديم المصلحة العامة وعدم الإضرار بالمجموع"},{"id":"o3","text":"إلغاء اشتراط حقيقة المصلحة"}],"correct_id":"o1","explanation":"يشترط الكتاب عموم المصلحة وألا تكون وهمية.","page":58},{"id":"u02_l02_q109","lesson_id":"u02_l02","difficulty":"hard","prompt":"اقتُرح حكم يحقق نفعًا ماليًا كبيرًا لكنه يصادم نصًا قطعيًا؛ كيف يصنف وفق ضابط المصالح؟","options":[{"id":"o3","text":"يقدم على الحكم النصي تلقائيًا"},{"id":"o2","text":"يقبل بمجرد ارتفاع الربح"},{"id":"o4","text":"يصبح مصلحة مرسلة مهما كانت المعارضة"},{"id":"o1","text":"لا يعد مصلحة معتبرة لمعارضته النص"}],"correct_id":"o1","explanation":"يمنع ضابط عدم المعارضة اعتبار المصلحة التي تصادم نصًا أو إجماعًا.","page":58},{"id":"u02_l02_q114","lesson_id":"u02_l02","difficulty":"medium","prompt":"شخص يقترح تعديل أنصبة الميراث الثابتة بحجة المصلحة؛ لماذا يرفض اقتراحه وفق الضوابط؟","options":[{"id":"o3","text":"لأن كل تصرف مالي مرفوض"},{"id":"o4","text":"لأنه يحقق منفعة عامة بالضرورة"},{"id":"o2","text":"لأنه يتعلق بمال قليل"},{"id":"o1","text":"لمعارضته حكمًا مقررًا بنص شرعي"}],"correct_id":"o1","explanation":"ضرب الكتاب هذا المثال على رفض المصلحة التي تعارض نصًا أو إجماعًا.","page":58},{"id":"u02_l02_q115","lesson_id":"u02_l02","difficulty":"medium","prompt":"ما الضابط الذي يرفض مصلحة تجارية لفرد تؤدي إلى إضرار مجموع الناس؟","options":[{"id":"o2","text":"إباحة أي ربح مهما كانت الوسيلة"},{"id":"o1","text":"عمومية المصلحة وعدم حصرها في نفع فردي مضر"},{"id":"o4","text":"الاكتفاء بالظن في تقدير النفع"},{"id":"o3","text":"تقديم منفعة الفرد دائمًا على الجميع"}],"correct_id":"o1","explanation":"اشترط الكتاب أن تحقق المصلحة منفعة عامة وألا تضر بالمجموع لمصلحة فرد.","page":58},{"id":"u02_l02_q117","lesson_id":"u02_l02","difficulty":"medium","prompt":"أي تمييز يوضح مفهوم جلب المصالح ودفع المفاسد في التربية الأخلاقية؟","options":[{"id":"o3","text":"الأمران يتعلقان بالربح المالي وحده"},{"id":"o4","text":"لا تدخل الأخلاق في تقدير المصالح"},{"id":"o1","text":"تشجيع مكارم الأخلاق جلب نفع والتحذير من مساوئها دفع ضرر"},{"id":"o2","text":"التحذير من السوء جلب ضرر والفضيلة دفع منفعة"}],"correct_id":"o1","explanation":"جاء بمقدمة الدرس مثال التشجيع على حسن الأخلاق لجلب المصلحة والتحذير من سيئها لدفع المفسدة.","page":56},{"id":"u02_l02_q123","lesson_id":"u02_l02","difficulty":"hard","prompt":"تاجر يحتج بالربح لتبرير بيع ما نهى الشرع عنه؛ أين الخلل في استدلاله وفق تصنيف المصالح؟","options":[{"id":"o3","text":"يقدم المصلحة العامة على الخاصة بالضرورة"},{"id":"o4","text":"يلتزم بضوابط الشريعة في المكاسب"},{"id":"o1","text":"يتمسك بمصلحة ملغاة لمخالفتها النص وما يترتب عليها من ضرر"},{"id":"o2","text":"يعمل بمصلحة معتبرة لمجرد زيادة الربح"}],"correct_id":"o1","explanation":"مثّل الدرس لملغاة المصلحة بالربح من تجارة الخمر مع تحريمها لضررها.","page":56},{"id":"u02_l02_q126","lesson_id":"u02_l02","difficulty":"medium","prompt":"ما الضابط الأول الذي يمنع قبول اقتراح يبدو نافعًا اقتصاديًا لكنه يخالف حكمًا شرعيًا ثابتًا؟","options":[{"id":"o4","text":"ألا يتطلب إنفاقًا حكوميًا"},{"id":"o2","text":"أن يحقق ربحًا للفرد فقط"},{"id":"o3","text":"أن يلقى تأييدًا سريعًا على الإنترنت"},{"id":"o1","text":"ألا يعارض نصًا أو إجماعًا ثابتًا"}],"correct_id":"o1","explanation":"ذكر الدرس عدم معارضة النص أو الإجماع من ضوابط المصلحة.","page":58},{"id":"u02_l02_q132","lesson_id":"u02_l02","difficulty":"medium","prompt":"لماذا جاء الترغيب في نظر الخاطب إلى المخطوبة ضمن المصالح المعتبرة؟","options":[{"id":"o4","text":"لأن العادة وحدها تحسم الأحكام"},{"id":"o3","text":"لإلغاء عقد الزواج"},{"id":"o1","text":"لإمكان نشوء الألفة والمودة بين الزوجين"},{"id":"o2","text":"لتحقيق ربح مالي للخاطب"}],"correct_id":"o1","explanation":"ساق الدرس هذا المثال للمصلحة التي اعتبرها الشرع طلبًا للألفة والمودة.","page":56},{"id":"u02_l02_q133","lesson_id":"u02_l02","difficulty":"hard","prompt":"يجني تاجر ربحًا من بيع الخمر ويحتج بذلك على مشروعية نشاطه؛ فما نوع المصلحة التي يدعيها؟","options":[{"id":"o1","text":"مصلحة ملغاة تعارض ضررها حكم الشرع"},{"id":"o2" يق.","page":67},{"id":"u02_l04_q122","lesson_id":"u02_l04","difficulty":"easy","prompt":"ما العمل الذي صرّح النبي ﷺ بأنه يجمعه مع الفطر في حديث منهج الإسلام في الحياة؟","options":[{"id":"o4","text":"الصلاة طوال الليل دون نوم"},{"id":"o3","text":"ترك الصيام فرضًا ونفلًا"},{"id":"o1","text":"الصيام في بعض الأيام والفطر في أخرى"},{"id":"o2","text":"صيام جميع الأيام دون انقطاع"}],"correct_id":"o1","explanation":"بيّن الحديث «أصوم وأفطر» في سياق التوازن.","page":68},{"id":"u02_l04_q125","lesson_id":"u02_l04","difficulty":"medium","prompt":"ما الموقف الذي يُظهر أثر الاقتداء بالنبي ﷺ في اختيار الأعمال؟","options":[{"id":"o1","text":"الحرص على العبادة التي يستطيع الإنسان المواظبة عليها"},{"id":"o3","text":"الحكم على الناس من كثرة تطوعهم"},{"id":"o4","text":"ترك جميع النوافل لأن النبي كان يصلي الفرض"},{"id":"o2","text":"التزام أقسى عمل ممكن ثم الانقطاع عنه"}],"correct_id":"o1","explanation":"يفهم من الحديث الاستدامة في العبادة ضمن الوسطية.","page":69},{"id":"u02_l04_q127","lesson_id":"u02_l04","difficulty":"medium","prompt":"أي مبدأ يطبَّق حين يتجنب الطالب إرهاق نفسه بنوافل تُضعفه عن الصلاة المفروضة؟","options":[{"id":"o4","text":"إلغاء حق البدن في الراحة"},{"id":"o2","text":"ترك الفرض عند وجود نافلة"},{"id":"o1","text":"تقديم الفرض وحفظ القدرة على دوام العبادة"},{"id":"o3","text":"اعتبار كل مشقة مطلوبة لذاتها"}],"correct_id":"o1","explanation":"شرح الدرس مراعاة الحقوق وعدم الغلو في التطوع.","page":70},{"id":"u02_l04_q128","lesson_id":"u02_l04","difficulty":"hard","prompt":"إذا كان الفرد قادرًا على التطوع لكنه يعلم أنه سينقطع بسبب الإفراط، فما الإرشاد الأقرب إلى الحديث؟","options":[{"id":"o3","text":"ترك الصلاة والصوم جميعًا"},{"id":"o1","text":"الاعتدال واختيار قدر يستطيع المحافظة عليه"},{"id":"o4","text":"قياس الإيمان بمدى التعب فقط"},{"id":"o2","text":"فرض كل النوافل على نفسه"}],"correct_id":"o1","explanation":"يقرر الحديث ومنهج الدرس اتباع الاعتدال الذي يديم الطاعة.","page":70},{"id":"u02_l04_q129","lesson_id":"u02_l04","difficulty":"medium","prompt":"ماذا يدل تقديم النبي ﷺ نفسه نموذجًا للصلاة والنوم والصيام والفطر؟","options":[{"id":"o3","text":"أن حق الجسد يناقض الالتزام الديني"},{"id":"o4","text":"أن الغلو شرط لصحة العمل"},{"id":"o1","text":"أن السنة العملية معيار للتوازن في العبادة"},{"id":"o2","text":"أن القدوة مقصورة على الكلام"}],"correct_id":"o1","explanation":"بيّن الدرس التصحيح بالاقتداء بهديه العملي في العبادات.","page":71},{"id":"u02_l04_q137","lesson_id":"u02_l04","difficulty":"medium","prompt":"لماذا لا يكون التقرب إلى الله مشروعًا بترك الحقوق الأسرية الأساسية بدعوى العبادة؟","options":[{"id":"o4","text":"لأن الاعتدال يعني ترك الصلاة"},{"id":"o3","text":"لأن مسؤوليات الأسرة تحرم التطوع كله"},{"id":"o1","text":"لأن هدي النبي ﷺ يجمع بين العبادة ومسؤوليات الحياة"},{"id":"o2","text":"لأن العبادة لا تشترط النية"}],"correct_id":"o1","explanation":"يفسر الدرس الحديث على أساس التوازن بين واجبات العبد وحياته.","page":69},{"id":"u02_l04_q138","lesson_id":"u02_l04","difficulty":"hard","prompt":"قال طالب: «كل زيادة في مشقة العبادة أفضل ولو خالفت سنة النبي ﷺ»؛ أين الخطأ؟","options":[{"id":"o4","text":"الامتثال لأوامر الله"},{"id":"o2","text":"الاهتمام بتعلم السنة"},{"id":"o1","text":"اعتبار الغلو أفضل من الاقتداء بالهدي النبوي"},{"id":"o3","text":"الحرص على الاعتدال"}],"correct_id":"o1","explanation":"يحذر الدرس من الغلو ويجعل اتباع السنة معيارًا للاستقامة.","page":69},{"id":"u02_l04_q142","lesson_id":"u02_l04","difficulty":"medium","prompt":"ما الخطأ الذي جمع قرارات الرجال الثلاثة في الحديث؟","options":[{"id":"o4","text":"أداء الفرائض في وقتها"},{"id":"o1","text":"اعتقاد أن التقرب إلى الله يقتضي ترك المباحات أو التشدد الدائم"},{"id":"o3","text":"السؤال عن عبادته في بيته"},{"id":"o2","text":"الحرص على معرفة سنة النبي ﷺ"}],"correct_id":"o1","explanation":"قرر بعضهم ترك النوم أو الإفطار أو الزواج على سبيل التشدد، فنهاهم النبي ﷺ.","page":68},{"id":"u02_l04_q145","lesson_id":"u02_l04","difficulty":"medium","prompt":"بماذا استدل النبي ﷺ على ضرورة استمرار العبادة الممكنة بدل المبالغة المؤدية إلى الملل؟","options":[{"id":"o1","text":"العمل الذي يداوم عليه صاحبه ولو قلّ أفضل"},{"id":"o3","text":"ترك الحقوق الاجتماعية شرط لصحة العبادة"},{"id":"o2","text":"الأعمال لا تقبل إلا مع ترك النوم"},{"id":"o4","text":"الصيام الدائم واجب على الجميع"}],"correct_id":"o1","explanation":"أورد الدرس توجيهًا إلى الأعمال التي يطيقها الإنسان ويستطيع المداومة عليها.","page":69},{"id":"u02_l04_q147","lesson_id":"u02_l04","difficulty":"medium","prompt":"ما سبب عدم القياس على النبي ﷺ في حكم الوصال بالصيام الذي ورد في الإثراء؟","options":[{"id":"o3","text":"لأن الوصال لا يرتبط بالصوم"},{"id":"o4","text":"لأن الأمة مكلفة بكل خصوصيات النبي ﷺ"},{"id":"o2","text":"لأنه كان ممنوعًا عليه وحده"},{"id":"o1","text":"لأنه من الأحكام التي اختص بها النبي ﷺ دون غيره"}],"correct_id":"o1","explanation":"ساق الدرس إباحة الوصال للنبي ﷺ مع النهي عنه لغيره من خصائصه.","page":71},{"id":"u02_l04_q152","lesson_id":"u02_l04","difficulty":"medium","prompt":"ما الذي يساعد على فهم قول الرجال الثلاثة إنهم تقالّوا عبادة النبي ﷺ؟","options":[{"id":"o3","text":"أنهم اعتبروا كل صلاة ممنوعة"},{"id":"o1","text":"أنهم رأوا العبادة قليلة قياسًا إلى ما ظنوه لازمًا لهم"},{"id":"o2","text":"أنهم أنكروا وجود عبادة أصلًا"},{"id":"o4","text":"أنهم تحدثوا عن مقدار المال فقط"}],"correct_id":"o1","explanation":"شرح الكتاب تقالّوها بمعنى رأوها قليلة.","page":68},{"id":"u02_l04_q156","lesson_id":"u02_l04","difficulty":"medium","prompt":"لماذا لا يصلح الانقطاع عن النوم والراحة معيارًا وحيدًا للعبادة المثلى؟","options":[{"id":"o2","text":"لأن العبادة لا صلة لها بحياة المسلم"},{"id":"o3","text":"لأن النوم عبادة مفروضة دائمًا بدل الصلاة"},{"id":"o1","text":"لأن اتباع السنة يوازن بين العبادة وحقوق الجسد والواجبات"},{"id":"o4","text":"لأن أعمال التطوع جميعها ممنوعة"}],"correct_id":"o1","explanation":"شرح الكتاب مراعاة طاقة الإنسان وأن التكليف لا يمنع حقوقه المباحة.","page":69},{"id":"u02_l04_q157","lesson_id":"u02_l04","difficulty":"hard","prompt":"عندما يرفض شخص الزواج باعتباره نقصًا في التديّن رغم قدرته، فأي جانب من سنة النبي ﷺ أهمله؟","options":[{"id":"o2","text":"تحريم الزواج على جميع المتعبدين"},{"id":"o1","text":"إقرار الزواج المباح ضمن منهج الاعتدال"},{"id":"o3","text":"ترك الصلوات من أجل الأسرة"},{"id":"o4","text":"أن الامتناع عن الزواج شرط لصحة الصيام"}],"correct_id":"o1","explanation":"بيّن الحديث أن النبي ﷺ يتزوج وأن الإعراض عن سنته بسبب التشدد غير مقبول.","page":70},{"id":"u02_l04_q158","lesson_id":"u02_l04","difficulty":"medium","prompt":"ما وجه الاستفادة من دوام العبادة المعتدلة مقارنة بالمبالغة التي تفضي إلى الانقطاع؟","options":[{"id":"o1","text":"العمل الممكن المستمر أنفع من التشدد الذي يوقع في الملل"},{"id":"o4","text":"الاستمرار في الطاعة لا قيمة له"},{"id":"o3","text":"العبادة الصحيحة تتوقف على الشهرة"},{"id":"o2","text":"كل عمل ديني يجب أن يتجاوز الطاقة"}],"correct_id":"o1","explanation":"عالج الدرس خطر المبالغة والتنطع ودعا إلى منهج معتدل يستطيع الإنسان الاستمرار فيه.","page":71},{"id":"u02_l04_q165","lesson_id":"u02_l04","difficulty":"hard","prompt":"إذا دافع شخص عن تشدد متواصل بحجة أن العبادة الكثيرة أفضل دائمًا؛ ما الرد الذي يقدمه الشرح؟","options":[{"id":"o3","text":"أن تضييع الواجبات شرط لزيادة الحسنات"},{"id":"o2","text":"تقديم الجهد الجسدي على صحة العمل في كل حالة"},{"id":"o4","text":"أن ترك السنة طريق لتكميل العبادة"},{"id":"o1","text":"العبادة المشروعة تقوم على الاتباع والدوام دون إرهاق يفضي إلى التقصير"}],"correct_id":"o1","explanation":"أوضح شرح الحديث أن المبالغة غير المنضبطة ليست مقياس صلاح العبادة.","page":69},{"id":"u02_l04_q166","lesson_id":"u02_l04","difficulty":"medium","prompt":"ما الصلة بين الزواج والعبادة في تصحيح النبي ﷺ لأقوال الرجال الثلاثة؟","options":[{"id":"o3","text":"الزواج لا يحقق أي مصلحة أسرية"},{"id":"o4","text":"الزواج واجب على كل فرد مهما اختلفت أحواله"},{"id":"o1","text":"الزواج من سنته ولا يتعارض مع الاستقامة"},{"id":"o2","text":"الزواج ممنوع لمن يريد العبادة"}],"correct_id":"o1","explanation":"جعل النبي ﷺ الزواج جزءًا من سنته في مقابلة من أراد تركه للتشدد.","page":69},{"id":"u02_l04_q168","lesson_id":"u02_l04","difficulty":"medium","prompt":"ما الذي يميّز الاعتدال في حديث الرج قبل وصول قوات الروم إلى المدينة؟","options":[{"id":"o4","text":"حصر التحرك في شأن تجاري عابر"},{"id":"o1","text":"مواجهة التهديد ومنع امتداد العدوان إلى المجتمع المسلم"},{"id":"o3","text":"طلب قتال قبائل لا وجود لها في الخبر"},{"id":"o2","text":"ترك المدينة بلا تخطيط لأي مواجهة"}],"correct_id":"o1","explanation":"ذكر الدرس أخبار حشود الروم وحلفائهم وعزم النبي ﷺ على مواجهتهم قبل وصولهم.","page":80},{"id":"u02_l06_q182","lesson_id":"u02_l06","difficulty":"hard","prompt":"في أي جانب يعد يوم تبوك شاهدًا على اتخاذ القرار بناء على معطيات تهديد خارجي؟","options":[{"id":"o3","text":"تجاهل أخبار الحدود حتى وقوع الهجوم"},{"id":"o2","text":"إلغاء المشورة في كل أمر مستقبلًا"},{"id":"o4","text":"رفض أي عمل دفاعي ولو ثبت الخطر"},{"id":"o1","text":"الاستعداد المبكر بعد ورود خبر تحشد القوى المعادية"}],"correct_id":"o1","explanation":"يربط الدرس سبب الخروج بخبر استعداد الروم للهجوم على المدينة.","page":80},{"id":"u02_l06_q184","lesson_id":"u02_l06","difficulty":"hard","prompt":"لماذا عُرف جيش تبوك بجيش العسرة؟","options":[{"id":"o2","text":"لأنه خرج في وقت وفرة غير محدودة"},{"id":"o4","text":"لأن المسلمين لم يحتاجوا إلى تجهيز أصلًا"},{"id":"o1","text":"لشدة الظروف وقلة الموارد أثناء التجهيز والخروج"},{"id":"o3","text":"لأن المعركة دارت في أرض خالية من الناس"}],"correct_id":"o1","explanation":"أشار الدرس إلى شدة الظروف التي صاحبت تجهيز الجيش وخروجه.","page":81},{"id":"u02_l06_q187","lesson_id":"u02_l06","difficulty":"medium","prompt":"كيف انعكس وصول المسلمين إلى تبوك وانصراف عدوهم عن القتال على صورة الدولة الإسلامية؟","options":[{"id":"o4","text":"جعل الشائعات حقيقة ثابتة"},{"id":"o1","text":"أظهر قدرتها على رد العدوان دون وقوع مواجهة مباشرة"},{"id":"o2","text":"أثبت غياب القوة المنظمة عن المسلمين"},{"id":"o3","text":"أوقف اتصال القبائل بالإسلام"}],"correct_id":"o1","explanation":"ذكر الدرس تحقق نصر معنوي وانكسار هيبة الروم دون قتال.","page":83},{"id":"u02_l06_q188","lesson_id":"u02_l06","difficulty":"hard","prompt":"ما الصلة بين نتائج يوم تبوك وازدياد وفود القبائل إلى المدينة في السنة التاسعة؟","options":[{"id":"o3","text":"جعلت عام الوفود سابقًا ليوم بدر"},{"id":"o4","text":"لم يكن لظهور قوة المسلمين أثر في الجزيرة"},{"id":"o2","text":"منعت النتائج كل قبيلة من مراسلة المدينة"},{"id":"o1","text":"عززت هيبة الدولة فتسارعت قبائل إلى إعلان إسلامها"}],"correct_id":"o1","explanation":"ربط الكتاب نتائج تبوك بمجيء الوفود وإعلان قبائل إسلامها في عام الوفود.","page":83},{"id":"u02_l07_q092","lesson_id":"u02_l07","difficulty":"medium","prompt":"مناقشة صحابية لعمر بن الخطاب رضي الله عنه في قرار عام مثال على أي حق؟","options":[{"id":"o1","text":"تقديم النصيحة لولي الأمر"},{"id":"o4","text":"التخلي عن الحقوق السياسية"},{"id":"o2","text":"إلغاء الشورى"},{"id":"o3","text":"منع المشاركة في الرأي"}],"correct_id":"o1","explanation":"أورد الكتاب هذه القصة مثالًا لإبداء النصح.","page":86},{"id":"u02_l07_q105","lesson_id":"u02_l07","difficulty":"medium","prompt":"ما الدلالة من قبول عمر بن الخطاب نصيحة صحابية بشأن المهور؟","options":[{"id":"o1","text":"مشروعية إبداء المرأة النصح في الشأن العام"},{"id":"o4","text":"أن أحكام الأسرة تنفصل عن النصوص"},{"id":"o2","text":"قصر النصيحة على الرجال"},{"id":"o3","text":"عدم جواز الاعتراض المهذب على قرار"}],"correct_id":"o1","explanation":"استدل الكتاب بالموقف على حق المرأة في النصيحة.","page":86},{"id":"u02_l07_q113","lesson_id":"u02_l07","difficulty":"medium","prompt":"أي مجال من الحقوق السياسية تجسده بيعة النساء للنبي ﷺ بعد الهجرة؟","options":[{"id":"o4","text":"تنظيم شؤون التجارة الخاصة"},{"id":"o2","text":"تملك المال وحده"},{"id":"o3","text":"الإنفاق على الأسرة فقط"},{"id":"o1","text":"المشاركة في صنع القرار وبناء الدولة"}],"correct_id":"o1","explanation":"عرض الدرس البيعة ضمن مشاركة النساء في صنع القرار.","page":86},{"id":"u02_l07_q127","lesson_id":"u02_l07","difficulty":"medium","prompt":"بأي نصيحة أسهمت السيدة خديجة رضي الله عنها بعد نزول الوحي أول مرة؟","options":[{"id":"o4","text":"منعت السؤال عن معنى الوحي"},{"id":"o3","text":"أوصت بترك مكة فورًا دون تشاور"},{"id":"o1","text":"أشارت بالذهاب إلى ورقة بن نوفل"},{"id":
